/* ===== CSS bloco legado 2 — ordem de cascata preservada ===== */
/* V10 — controle operacional da jornada da obra */
.alert-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.alert-card{padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.alert-card strong{display:block;font-size:20px;margin-top:5px}.alert-card small{color:var(--muted)}
.alert-bad{border-left:4px solid #a65e52}.alert-warn{border-left:4px solid #b88635}.alert-ok{border-left:4px solid #66866f}
.timeline{display:grid;gap:9px}.timeline-item{display:grid;grid-template-columns:82px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.timeline-date{font-weight:800;color:var(--gold-dark)}.timeline-title b{display:block}.timeline-title small{color:var(--muted)}
.health{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.health-item{padding:14px;border:1px solid var(--line);border-radius:13px;background:#fffdf9}.health-item b{display:block;margin-top:5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}.dot.ok{background:#66866f}.dot.warn{background:#b88635}.dot.bad{background:#a65e52}
.priority{font-size:11px;font-weight:700;padding:5px 8px;border-radius:99px;background:#f3eadc}.priority-Crítica{color:#9a493f}.priority-Alta{color:#a96f1e}.priority-Média{color:#8b6b2c}.priority-Baixa{color:#66866f}
.auto-late{color:#a65e52;font-weight:700}.auto-ok{color:#66866f;font-weight:700}
.chart-row{display:grid;grid-template-columns:150px 1fr 115px;gap:10px;align-items:center;margin:10px 0}.chart-track{height:10px;background:#eadfcd;border-radius:99px;overflow:hidden}.chart-track i{display:block;height:100%;background:linear-gradient(90deg,#a87827,#b88c3b)}
.checklist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px}.checkitem{display:flex;align-items:center;gap:9px;padding:8px 0}.checkitem input{accent-color:var(--gold)}
.mini-note{background:#f7efe3;border:1px solid var(--line);padding:12px;border-radius:12px;color:var(--muted);font-size:12px}

/* ===== CSS bloco legado 3 — ordem de cascata preservada ===== */
/* V11 - Relatórios */
.report-actions{position:relative;display:inline-block}
.report-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:250px;background:#fffdf9;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 35px rgba(93,70,35,.16);padding:8px;z-index:50;display:none}
.report-menu.show{display:block}
.report-menu button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:12px 14px;border-radius:10px;text-align:left;color:var(--text);font:inherit;cursor:pointer}

.report-note{font-size:11px;color:var(--muted);padding:8px 12px 6px;border-top:1px solid var(--line);margin-top:4px}

/* ===== CSS bloco legado 16 — ordem de cascata preservada ===== */
/* Correção: o modal nunca teve rolagem própria. Com formulários longos
   (Obra tem 15+ campos), em telas menores o botão Salvar ficava fora da
   área visível, sem como rolar até ele. */
.modalbox{max-height:88vh!important;display:flex!important;flex-direction:column!important;overflow:hidden!important}
.modalbox #form{overflow-y:auto!important;flex:1 1 auto!important;min-height:0!important;padding-right:4px!important}
.modalbox .toolbar,.modalbox .actions{flex:0 0 auto!important}

/* ===== CSS bloco legado 17 — ordem de cascata preservada ===== */
/* Correção: blocos de estilo mais recentes (V7 em diante) redefiniam
   .app{grid-template-columns:...} fora de qualquer @media, sobrescrevendo
   a regra mobile (.app{grid-template-columns:1fr}) por estarem depois dela
   no arquivo. Isso mantinha uma coluna reservada para a barra lateral mesmo
   com ela escondida (.side{display:none}), espremendo todo o conteúdo numa
   fração da tela em celulares e deixando valores dos cards ilegíveis. */
@media(max-width:900px){
  .app{grid-template-columns:1fr!important}
}
/* Tabelas (Financeiro, Cronograma, Profissionais etc.) têm mais colunas do
   que cabe numa tela de celular. Em vez de espremer o texto a ponto de
   cortar informação, o cartão que envolve a tabela ganha rolagem horizontal
   própria — a tabela continua legível, só rola dentro do próprio cartão em
   vez de forçar a página inteira a rolar de lado. */
.card:has(table){overflow-x:auto}
/* Existe uma regra global "table{min-width:760px}" pensada pra evitar que
   tabelas com muitas colunas fiquem espremidas — mas ela nunca foi restrita
   às tabelas que realmente precisam disso, e forçava até tabelas pequenas de
   2 colunas (ex.: "Resumo financeiro") a ficarem largas demais pra caber no
   cartão onde estão. Isso corta os valores não só no celular, mas em
   qualquer largura de tela onde esse cartão de 2 colunas divide espaço com
   outro ao lado (ex.: o layout "Progresso da obra" + "Resumo financeiro"
   lado a lado no Dashboard) — a coluna do cartão fica mais estreita que os
   760px forçados. Removida por completo: cada tabela volta a ocupar só o
   espaço que o próprio conteúdo pede; tabelas com muitas colunas continuam
   legíveis via rolagem do cartão (regra acima), sem precisar de uma largura
   mínima artificial em nenhuma largura de tela. */
table{min-width:0!important}
/* Os cards de indicador (KPI) têm uma regra propositalmente restritiva que
   corta o texto do valor com reticências pra ele nunca "vazar" do cartão
   (".kpi strong{overflow:hidden;text-overflow:ellipsis}"). Isso é razoável
   quando o cartão tem espaço suficiente, mas em celular, com 2 cartões por
   linha, não sobra largura pra números como "R$ 80.000,00" e o valor fica
   ilegível. Em telas bem estreitas, cada cartão passa a ocupar a linha
   inteira — sobra espaço de sobra pro valor aparecer completo. */
@media(max-width:480px){
  .kpis{grid-template-columns:1fr!important}
}
/* Cabeçalho do Dashboard (título + botão "Gerar Relatório" + prazo) ficava
   numa única linha sem quebrar, empurrando a página pra o lado. */
@media(max-width:600px){
  .top{flex-wrap:wrap;row-gap:10px}
  .dash-actions{flex-wrap:wrap;width:100%}

.btn:active{transform:translateY(1px) scale(.98)}
table tr{transition:background .12s ease}
table tbody tr:hover{background:rgba(212,175,55,.08)}

.bar span,.bar i{transition:width .4s ease}

/* tabelas com muitas colunas (Fornecedores, pagamentos, imprevistos etc.) ficavam
   cortadas em telas estreitas em vez de se ajustar — agora deslizam horizontalmente

function saveForm(){let data=Object.fromEntries(new FormData(document.getElementById('form')).entries());schemas[editing.type].forEach(([f,tp])=>{if(['previsto','contratado','pago','valor','extra'].includes(f))data[f]=parseMoney(data[f]);else if(tp==='number')data[f]=+data[f]||0});if(editing.id){let i=db[editing.type].findIndex(x=>x.id===editing.id);db[editing.type][i]={...db[editing.type][i],...data}}else{data.id=Date.now();db[editing.type].push(data)}closeModal();persist()}

<script>

/* Helpers */
const isoToday=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function dayDiff(a,b){if(!a||!b)return null;let A=new Date(a+'T12:00:00'),B=new Date(b+'T12:00:00');return Math.ceil((B-A)/86400000)}
function autoSituation(x){
 if(x.status==='Concluído'||(+x.progresso||0)>=100)return {label:'Concluído',cls:'auto-ok'};
 if(x.fim && x.fim<isoToday())return {label:'Atrasado',cls:'auto-late'};
 if(x.fim){let d=dayDiff(isoToday(),x.fim);if(d!==null&&d<=3)return {label:'Atenção',cls:'gold'}}
 return {label:'Dentro do prazo',cls:'auto-ok'}
}
function materialTotal(x){return (+x.quantidade||0)*(+x.unitario||0)}
function unforeseenTotal(){return db.imprevistos.reduce((a,x)=>a+(+x.valor||0),0)}
function paymentDue(){return db.pagamentos.filter(x=>x.status!=='Pago').reduce((a,x)=>a+(+x.valor||0),0)}
function categoryStats(){
 let m={};
 db.obra.forEach(x=>{let k=x.categoria||'Outros';m[k]=m[k]||{prev:0,real:0};m[k].prev+=(+x.previsto||0);m[k].real+=(+x.contratado||0)});
 db.materiais.forEach(x=>{let k=x.categoria||'Outros';m[k]=m[k]||{prev:0,real:0};m[k].real+=materialTotal(x)});
 return m;
}

/* Currency-aware modal override */
openModal=function(type,id=null){
 editing={type,id};let x=id?db[type].find(i=>i.id===id):{};
 document.getElementById('modalTitle').textContent=id?'Editar registro':'Novo registro';
 document.getElementById('form').innerHTML=schemas[type].map(([f,tp,opts])=>{
   const isMoney=['previsto','contratado','pago','valor','extra','unitario'].includes(f);
   return `<div class='${tp==='textarea'?'full':''} ${isMoney?'moneyinput':''}'><label>${labels[f]||f}</label>${
    tp==='select'?`<select name='${f}'>${opts.split('|').map(o=>`<option ${x[f]===o?'selected':''}>${o}</option>`).join('')}</select>`:
    tp==='textarea'?`<textarea name='${f}' rows='4'>${esc(x[f]||'')}</textarea>`:
    isMoney?`<input name='${f}' class='currency-input' type='text' inputmode='numeric' value='${moneyInput(x[f]||0)}' placeholder='0,00'>`:
    `<input name='${f}' type='${tp}' value='${esc(x[f]??'')}' ${f==='progresso'?"min='0' max='100'":''}>`
   }</div>`
 }).join('');
 document.getElementById('modal').classList.add('show');bindMoneyInputs(document.getElementById('form'))
};
saveForm=function(){
 let data=Object.fromEntries(new FormData(document.getElementById('form')).entries());
 schemas[editing.type].forEach(([f,tp])=>{
   if(['previsto','contratado','pago','valor','extra','unitario'].includes(f))data[f]=parseMoney(data[f]);
   else if(tp==='number')data[f]=+data[f]||0
 });
 if(editing.type==='materiais')data.valor=materialTotal(data);
 if(editing.id){let i=db[editing.type].findIndex(x=>x.id===editing.id);db[editing.type][i]={...db[editing.type][i],...data}}
 else{data.id=Date.now();db[editing.type].push(data)}
 closeModal();persist()
};

/* Extended value renderer */
const oldVal=val;
val=function(x,f){
 if(f==='unitario')return money(x[f]);
 if(f==='quantidade')return `${x[f]||0} ${x.unidade||''}`;
 if(f==='valor' && db.materiais.includes(x))return money(materialTotal(x));
 if(f==='prioridade')return `<span class='priority priority-${x[f]}'>${x[f]||'Média'}</span>`;
 return oldVal(x,f)
};

/* Checklist actions */
function toggleFinal(id,checked){let x=db.checklistFinal.find(i=>i.id===id);if(x)x.feito=checked;persist()}
function toggleWorkCheck(id,key,checked){let x=db.obra.find(i=>i.id===id);if(x)x[key]=checked;persist()}
function finishWork(id){

 let ok=['checkServico','checkConferido','checkLimpo','checkPagamento','checkPendencias'].every(k=>x[k]);

/* Totals now calculate material totals from qty x unit price */
/* Profissionais cujo Valor/Pago já não está contado em nenhuma etapa da
   Obra: um profissional vinculado a pelo menos uma etapa tem seu custo
   representado ali (no Contratado/Pago daquela etapa); contar o Valor/Pago
   do cadastro dele de novo seria somar o mesmo custo duas vezes. Só entra
   no total quem NÃO está vinculado a nenhuma etapa. */
function profissionaisAvulsos(){
 /* Regra original: excluía TODO profissional vinculado a uma etapa,
    assumindo que o Contratado/Pago da etapa já refletia o custo dele.
    Falha quando a etapa está vinculada mas fica com Contratado zerado —
    que é o caso normal de quem preenche o valor do profissional direto
    no cadastro de Profissionais (onde tem forma de pagamento, parcelas
    etc.) e nunca duplica esse número no formulário da etapa. Nesse caso
    o profissional voltava a contar, porque a etapa vinculada a ele não
    tem valor nenhum registrado — só é excluído quando a(s) etapa(s)
    vinculadas já somam um Contratado próprio maior que zero. */
 const contratadoPorProfissional={};
 db.obra.forEach(x=>{
   if(x.profissionalId){
     const k=String(x.profissionalId);
     contratadoPorProfissional[k]=(contratadoPorProfissional[k]||0)+(+x.contratado||0);
   }
 });
 const vinculados=new Set(db.obra.filter(x=>x.profissionalId).map(x=>String(x.profissionalId)));
 return (db.profissionais||[]).filter(p=>{
   const k=String(p.id);
   if(!vinculados.has(k)) return true;
   return (contratadoPorProfissional[k]||0)===0;
 });
}
totals=function(){
 let previsto=db.obra.reduce((a,x)=>a+(+x.previsto||0),0),
 servContr=db.obra.reduce((a,x)=>a+(+x.contratado||0),0),
 servPago=db.obra.reduce((a,x)=>a+(+x.pago||0),0),
 materiais=db.materiais.reduce((a,x)=>a+materialTotal(x),0),
 materiaisPago=db.materiais.reduce((a,x)=>a+(+x.pago||0),0),
 avulsos=profissionaisAvulsos(),
 maoDeObra=avulsos.reduce((a,x)=>a+(+x.valor||0),0),
 maoDeObraPago=avulsos.reduce((a,x)=>a+(+x.pago||0),0),
 extras=unforeseenTotal();
 let contratado=servContr+materiais+maoDeObra,pago=servPago+materiaisPago+maoDeObraPago,
 eq=db.equipamentos.reduce((a,x)=>a+(+x.valor||0),0),
 adm=db.admin.reduce((a,x)=>a+(+x.pago||0),0),
 prog=db.obra.length?Math.round(db.obra.reduce((a,x)=>a+(+x.progresso||0),0)/db.obra.length):0;
 return{previsto,contratado,pago,apagar:Math.max(0,contratado-pago),eq,adm,prog,materiais,maoDeObra,extras}
};

persistNoRender();
render();
</script>

<script>
/* V11 - Central de relatórios */
function escCsv(v){
  v = (v===null||v===undefined)?'':String(v);
  if(/^[=+\-@\t\r]/.test(v)) v = "'"+v;
  return '"'+v.replace(/"/g,'""')+'"';
}
function brDateNow(){
  return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date());
}
function safeFileName(s){
  return (s||'noremati').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9-_]+/g,'_').replace(/^_+|_+$/g,'').toLowerCase();
}
function empresaNome(){ return (db.config&&db.config.empresa)||'Noremati Pilates Clássico'; }
function reportPeriod(){
  const a=db.config?.inicio?fmt(db.config.inicio):'—';
  const b=db.config?.fim?fmt(db.config.fim):'—';
  return `${a} → ${b}`;
}
function reportTotals(){
  const t=totals();
  const budget=+db.config?.orcamento||0;
  return {
    budget, previsto:t.previsto||0, contratado:t.contratado||0,
    pago:t.pago||0, apagar:t.apagar||0, materiais:t.materiais||0,
    imprevistos:unforeseenTotal(), administrativo:t.adm||0,
    equipamentos:t.eq||0, progresso:t.prog||0,
    saldo:budget-(t.contratado||0)-unforeseenTotal()
  };
}
function buildReportData(){
  const rt=reportTotals();
  const cats=categoryStats();
  return {
    geradoEm:brDateNow(),
    empresa:{
      nome:empresaNome(),
      cnpj:db.config?.cnpj||'Não informado',
      responsavel:db.config?.responsavel||'Não informado',
      telefone:db.config?.telefone||'Não informado',
      email:db.config?.email||'Não informado',
      endereco:db.config?.endereco||'Não informado',
      cidade:db.config?.cidade||'',
      uf:db.config?.uf||'',
      projeto:db.config?.projeto||'Reforma do Studio',
      responsavelObra:db.config?.responsavelObra||'Não informado',
      periodo:reportPeriod()
    },
    resumo:rt,
    categorias:Object.entries(cats).map(([categoria,v])=>({
      categoria, previsto:v.prev||0, contratado:v.real||0,
      diferenca:(v.real||0)-(v.prev||0)
    })),
    pagamentos:[...(db.pagamentos||[])],
    materiais:[...(db.materiais||[])],
    imprevistos:[...(db.imprevistos||[])],
    admin:[...(db.admin||[])],
    obra:[...(db.obra||[])]
  };
}
function downloadBlob(content,type,filename){
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function csvMoney(v){ return Number(v||0).toFixed(2).replace('.',','); }

function exportFinanceiroCSV(){
  const r=buildReportData(), rows=[];
  rows.push(['RELATÓRIO FINANCEIRO - REFORMA']);
  rows.push(['Empresa',r.empresa.nome],['CNPJ / CPF',r.empresa.cnpj],['Responsável',r.empresa.responsavel],['Período',r.empresa.periodo],['Gerado em',r.geradoEm]);
  rows.push([]);
  rows.push(['RESUMO FINANCEIRO']);
  rows.push(['Investimento planejado',csvMoney(r.resumo.budget)]);
  rows.push(['Valor contratado',csvMoney(r.resumo.contratado)]);
  rows.push(['Valor pago',csvMoney(r.resumo.pago)]);
  rows.push(['A pagar',csvMoney(r.resumo.apagar)]);
  rows.push(['Materiais',csvMoney(r.resumo.materiais)]);
  rows.push(['Imprevistos',csvMoney(r.resumo.imprevistos)]);
  rows.push(['Administrativo pago',csvMoney(r.resumo.administrativo)]);
  rows.push(['Saldo disponível',csvMoney(r.resumo.saldo)]);
  rows.push([]);
  rows.push(['COMPARATIVO POR CATEGORIA']);
  rows.push(['Categoria','Previsto','Contratado','Diferença']);
  r.categorias.forEach(x=>rows.push([x.categoria,csvMoney(x.previsto),csvMoney(x.contratado),csvMoney(x.diferenca)]));
  rows.push([]);
  rows.push(['PAGAMENTOS']);
  rows.push(['Referência','Tipo','Valor','Vencimento','Forma','Status']);
  r.pagamentos.forEach(x=>rows.push([x.referencia||'',x.tipo||'',csvMoney(x.valor),fmt(x.vencimento),x.forma||'',x.status||'']));
  rows.push([]);
  rows.push(['MATERIAIS']);
  rows.push(['Material','Categoria','Fornecedor','Quantidade','Unidade','Valor unitário','Valor total','Status']);
  r.materiais.forEach(x=>rows.push([x.nome||'',x.categoria||'',x.fornecedor||'',x.quantidade||0,x.unidade||'',csvMoney(x.unitario),csvMoney(materialTotal(x)),x.status||'']));
  rows.push([]);
  rows.push(['IMPREVISTOS']);
  rows.push(['Item','Categoria','Responsável','Valor','Impacto prazo (dias)','Status']);
  r.imprevistos.forEach(x=>rows.push([x.nome||'',x.categoria||'',x.responsavel||'',csvMoney(x.valor),x.impactoDias||0,x.status||'']));
  rows.push([]);

function projectCoverPreviewHTML(src){
 return src ? `<img src="${src}" alt="Capa do projeto">` : '<span>Nenhuma imagem selecionada</span>';
}
function resizeProjectCover(file){
 return new Promise((resolve,reject)=>{
   if(!file || !file.type.startsWith('image/')) return reject(new Error('Selecione um arquivo de imagem.'));
   const reader=new FileReader();
   reader.onload=()=>{
     const img=new Image();
     img.onload=()=>{
       const max=1600, scale=Math.min(1,max/Math.max(img.width,img.height));
       const canvas=document.createElement('canvas');
       canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
       canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
       resolve(canvas.toDataURL('image/jpeg',.78));
     };
     img.onerror=()=>reject(new Error('Não foi possível processar a imagem.'));
     img.src=reader.result;
   };
   reader.onerror=()=>reject(new Error('Não foi possível ler o arquivo.'));
   reader.readAsDataURL(file);
 });
}

 else{p=normalizeP({id:newPid(),obra:[],profissionais:[],materiais:[],equipamentos:[],admin:[],imprevistos:[],pagamentos:[],checklistFinal:defaultFinalChecklist(),config:{}});db.projects.push(p);db.selectedProjectId=p.id}
 p.nome=f.pn.trim();p.tipo=f.pt;p.status=f.ps;p.config={...p.config,projeto:p.nome,empresa:f.pe||'',responsavel:f.pr||'',respObra:f.pro||'',endereco:f.pend||'',cidade:f.pcid||'',orcamento:parseMoney(f.porc),inicio:f.pini||'',fim:f.pfim||''};
 p.coverImage=projectCoverDraft||'';

<script id="v133-checklist-unificado">
/* V13.3 — checklist único.
   Antes existiam dois checklists separados na tela (um automático por
   etapa, outro fixo de entrega do Studio), cada um numa chave diferente
   do banco. Aqui os dois são migrados uma única vez para uma chave só,
   db.checklist, e a tela passa a ter uma única lista com botões de
   adicionar, editar e excluir em qualquer item — automático ou manual.
   Um item automático (nascido de uma etapa da obra) continua sendo
   atualizado sozinho enquanto ninguém mexe nele; no momento em que o
   usuário edita, marca/desmarca ou exclui esse item, ele "solta" da
   etapa (vira um item comum) para não ter sua edição sobrescrita depois. */

function migrateChecklistUnificado(){
  db.checklist = Array.isArray(db.checklist) ? db.checklist : [];
  db.checklistIgnorar = Array.isArray(db.checklistIgnorar) ? db.checklistIgnorar : [];

  /* Migração: puxa itens que ainda estejam nas chaves antigas
     (checklistFinal / checklistEtapas) para dentro de db.checklist.
     Idempotente — pode rodar de novo (ex.: depois de restaurar um
     backup antigo) sem duplicar nada. */
  const antigos = [
    ...(Array.isArray(db.checklistFinal)?db.checklistFinal:[]),
    ...(Array.isArray(db.checklistEtapas)?db.checklistEtapas:[])
  ];
  antigos.forEach(x=>{
    if(!db.checklist.some(e=>String(e.id)===String(x.id))){
      db.checklist.push({
        id:x.id, nome:x.nome, feito:!!x.feito,
        auto:x.manual===false, sourceObraId:x.sourceObraId||null
      });
    }
  });
  /* Esvazia as chaves antigas (mantidas só para não quebrar código legado). */
  db.checklistFinal = [];
  db.checklistEtapas = [];

  db.checklist.forEach(x=>{
    if(x.auto===undefined) x.auto = false;
    if(x.sourceObraId===undefined) x.sourceObraId = null;
  });

  if(typeof PROJECT_KEYS!=='undefined'){
    if(!PROJECT_KEYS.includes('checklist')) PROJECT_KEYS.push('checklist');
    if(!PROJECT_KEYS.includes('checklistIgnorar')) PROJECT_KEYS.push('checklistIgnorar');
  }

  const p = (typeof curP==='function') ? curP() : null;
  if(p){ p.checklist = db.checklist; p.checklistIgnorar = db.checklistIgnorar; p.checklistFinal=[]; p.checklistEtapas=[]; }
  saveDB();
}
migrateChecklistUnificado();

function persistChecklist(){
  const p=(typeof curP==='function')?curP():null;
  if(p) p.checklist=db.checklist;
  saveDB();
}

function syncChecklistFromStages(persistChanges=true){
  if(!Array.isArray(db.obra)) return false;
  if(!Array.isArray(db.checklist)) db.checklist=[];
  if(!Array.isArray(db.checklistIgnorar)) db.checklistIgnorar=[];

  let changed=false;

  db.obra.forEach(stage=>{
    if(db.checklistIgnorar.includes(String(stage.id))) return;
    let item = db.checklist.find(x=>String(x.sourceObraId)===String(stage.id));
    const shouldBeDone=(+stage.progresso||0)>=100 || stage.status==='Concluído';

    if(!item){
      db.checklist.push({
        id:'auto_'+stage.id,
        nome:stage.nome,
        feito:shouldBeDone,
        auto:true,
        sourceObraId:stage.id
      });
      changed=true;
    }else if(item.auto){
      if(item.nome!==stage.nome){ item.nome=stage.nome; changed=true; }
      if(item.feito!==shouldBeDone){ item.feito=shouldBeDone; changed=true; }
    }
  });

  /* remove itens automáticos (ainda vinculados) cuja etapa foi excluída */
  const before=db.checklist.length;
  db.checklist = db.checklist.filter(item=>{
    if(!item.auto || !item.sourceObraId) return true;
    return db.obra.some(stage=>String(stage.id)===String(item.sourceObraId));
  });
  if(db.checklist.length!==before) changed=true;

  /* Evita gravar no localStorage durante simples renderizações/leitura de estatísticas. */
  if(changed && persistChanges) persistChecklist();
  return changed;
}

function checklistStats(){
  syncChecklistFromStages(false);
  const total=db.checklist.length;
  const done=db.checklist.filter(x=>x.feito).length;
  return {total,done,pct:total?Math.round(done/total*100):0};
}

function addChecklistItem(){
  const nome = prompt('Nome do novo item do checklist:');
  if(!nome || !nome.trim()) return;
  db.checklist.push({id:'manual_'+Date.now(), nome:nome.trim(), feito:false, auto:false, sourceObraId:null});
  persistChecklist();
  render();
}

function editChecklistItem(id){
  const item=db.checklist.find(x=>String(x.id)===String(id));
  if(!item) return;
  const nome=prompt('Editar item do checklist:',item.nome);
  if(nome===null) return;
  if(!nome.trim()){alert('O nome não pode ficar em branco.');return}
  item.nome=nome.trim();
  item.auto=false; /* edição manual desvincula da etapa de origem */
  persistChecklist();
  render();
}

function toggleChecklistItem(id,checked){
  const item=db.checklist.find(x=>String(x.id)===String(id));
  if(!item) return;
  item.feito=checked;
  item.auto=false; /* marcar/desmarcar manualmente também desvincula */
  persistChecklist();
  render();
}

function deleteChecklistItem(id){
  const item=db.checklist.find(x=>String(x.id)===String(id));
  if(!item) return;
  if(!confirm(`Excluir o item "${item.nome}" do checklist?`)) return;
  if(item.sourceObraId && !db.checklistIgnorar.includes(String(item.sourceObraId))){
    db.checklistIgnorar.push(String(item.sourceObraId));
  }
  db.checklist=db.checklist.filter(x=>String(x.id)!==String(id));
  persistChecklist();
  render();
}

/* Após salvar uma etapa, sincroniza checklist automático */
const saveFormChecklistBase = saveForm;
saveForm = function(){
  const typ = editing?.type;
  saveFormChecklistBase();
  if(typ==='obra'){ syncChecklistFromStages(); render(); }
};

/* Finalizar etapa também reflete imediatamente no checklist */
const finishWorkChecklistBase = finishWork;
finishWork = function(id){
  finishWorkChecklistBase(id);
  syncChecklistFromStages();
  render();
};

/* Substitui somente a página Cronograma para incluir o checklist único */
const pageChecklistBase = page;
page = function(k){
  if(k==='dashboard'){
    const html = pageChecklistBase(k);
    const total=db.checklist.length, done=db.checklist.filter(x=>x.feito).length;
    const pct = total?Math.round(done/total*100):0;
    return html.replace(/(\\d+)% do checklist final/, pct+'% do checklist final');
  }
  if(k!=='cronograma') return pageChecklistBase(k);

  syncChecklistFromStages();
  const st=checklistStats();

  const itemsHtml = db.checklist.length ? db.checklist.map(x=>{
    const prog = x.auto ? (db.obra.find(s=>String(s.id)===String(x.sourceObraId))?.progresso||0) : null;
    return `<label class="checkitem auto-item">
      <span class="auto-label">
        <input type="checkbox" ${x.feito?'checked':''} onchange="toggleChecklistItem('${x.id}',this.checked)">
        <span>${esc(x.nome)}</span>
      </span>
      <span class="item-tools">${x.auto?`<span class="auto-chip">Automático · ${prog}%</span>`:''}<button type="button" onclick="event.preventDefault();editChecklistItem('${x.id}')">Editar</button><button type="button" onclick="event.preventDefault();deleteChecklistItem('${x.id}')">Excluir</button></span>
    </label>`;
  }).join('') : `<div class="empty">Nenhum item no checklist ainda. Cadastre etapas na obra ou clique em "+ Novo item".</div>`;

  return header('Cronograma','Prazos, dependências e situação automática',
    `<button class='btn' onclick="openModal('obra')">+ Adicionar etapa</button>`)+
  `<div class='card'><table><thead><tr><th>Etapa</th><th>Dependência</th><th>Início</th><th>Fim</th><th>Situação</th><th>Progresso</th><th></th></tr></thead><tbody>${
    db.obra.map(x=>{let s=autoSituation(x);return `<tr><td><b>${esc(x.nome)}</b><div class='hint'>${esc((typeof profissionaisResponsaveisEtapa==='function'?profissionaisResponsaveisEtapa(x.id).map(p=>p.nome).join(', '):'')||x.responsavel||'')}</div></td><td>${esc(x.dependencia||'—')}</td><td>${fmt(x.inicio)}</td><td>${fmt(x.fim)}</td><td class='${s.cls}'>${s.label}</td><td><div class='progressline'><div class='bar'><i style='width:${x.progresso||0}%'></i></div>${x.progresso||0}%</div></td><td class='rowactions'><button onclick="openModal('obra',${x.id})">Editar</button></td></tr>`}).join('')
  }</tbody></table></div>
  <div class='card section' style='margin-top:14px'>
    <div class='toolbar'>
      <div>
        <h3 style='margin:0'>Checklist da obra</h3>
        <span class='hint'>Etapas chegam a 100% e são marcadas automaticamente. Adicione, edite ou exclua qualquer item.</span>
      </div>
      <div class='checklist-head-actions'>
        <div class='checklist-progress'><div class='mini-progress'><i style='width:${st.pct}%'></i></div><span>${st.done}/${st.total} · ${st.pct}%</span></div>
        <button class='btn secondary' onclick='addChecklistItem()'>+ Novo item</button>
      </div>
    </div>
    ${itemsHtml}
    ${st.total>0 && st.done===st.total ? `<div class='mini-note' style='margin-top:14px;color:#55765f;font-weight:800'>✓ CHECKLIST CONCLUÍDO — todos os itens foram finalizados.</div>`:''}
  </div>`;
};

/* Primeira sincronização ao abrir a versão */
syncChecklistFromStages();
render();
</script>


<script id="v134-obra-profissional-vinculo">
/* V13.4 — Responsável/telefone da etapa passam a vir do cadastro de
   Profissionais, em vez de texto solto digitado de novo em cada etapa.
   - Se o profissional estiver cadastrado: nome e telefone ficam
     travados (somente leitura), sempre lidos do cadastro.
   - Se não estiver ("Outro"): continua texto livre, como já era.
   Isso evita telefone desatualizado em etapas antigas quando o
   profissional troca de número — corrige uma vez no cadastro dele e
   todas as etapas vinculadas atualizam sozinhas. */

function migrateObraResponsavelVinculo(){
  if(!Array.isArray(db.obra) || !Array.isArray(db.profissionais)) return;
  let changed=false;
  db.obra.forEach(x=>{
    if(x.profissionalId===undefined) x.profissionalId=null;
    if(!x.profissionalId && x.responsavel){
      const match=db.profissionais.find(p=>String(p.nome||'').trim().toLowerCase()===String(x.responsavel).trim().toLowerCase());
      if(match){ x.profissionalId=match.id; x.telefone=match.telefone||x.telefone||''; changed=true; }
    }
  });
  if(changed){ const p=(typeof curP==='function')?curP():null; if(p) p.obra=db.obra; }
  saveDB();
}
migrateObraResponsavelVinculo();

/* Sincroniza etapas vinculadas quando o cadastro do profissional muda */
const saveFormProfSyncBase = saveForm;
saveForm = function(){
  const typ = editing?.type;
  const idBeforeSave = editing?.id;
  saveFormProfSyncBase();
  if(typ==='profissionais' && Array.isArray(db.obra) && Array.isArray(db.profissionais)){
    /* Calcula o valor de cada parcela (Valor Total ÷ nº de parcelas) e
       guarda no cadastro, para exibir sem precisar recalcular na tela. */
    const prof = idBeforeSave!=null ? db.profissionais.find(x=>String(x.id)===String(idBeforeSave)) : db.profissionais[db.profissionais.length-1];
    let changed=false;
    if(prof){
      const n=parseInt(prof.parcelas)||1;
      const novoValorParcela = (prof.forma==='Cartão' && +prof.valor>0) ? (+prof.valor/n) : null;
      if(prof.valorParcela!==novoValorParcela){ prof.valorParcela=novoValorParcela; changed=true; }
    }
    db.obra.forEach(x=>{
      if(x.profissionalId){
        const p2=db.profissionais.find(p=>String(p.id)===String(x.profissionalId));
        if(p2 && (x.responsavel!==p2.nome || x.telefone!==(p2.telefone||''))){
          x.responsavel=p2.nome; x.telefone=p2.telefone||''; changed=true;
        }
      }
    });
    if(changed){
      const p=(typeof curP==='function')?curP():null; if(p){ p.obra=db.obra; p.profissionais=db.profissionais; }
      saveDB();
      render();
    }
  }
};

/* Se o profissional for excluído, desvincula (sem apagar o texto já salvo na etapa) */
const delProfDetachBase = del;
del = function(type,id){
  delProfDetachBase(type,id);
  if(type==='profissionais' && Array.isArray(db.obra) && Array.isArray(db.profissionais)){
    const aindaExiste = db.profissionais.some(p=>String(p.id)===String(id));
    if(!aindaExiste){
      let changed=false;
      db.obra.forEach(x=>{ if(x.profissionalId && String(x.profissionalId)===String(id)){ x.profissionalId=null; changed=true; } });
      if(changed){
        const p=(typeof curP==='function')?curP():null; if(p) p.obra=db.obra;
        saveDB();
        render();
      }
    }
  }
};

/* Monta o seletor de profissional no formulário de etapa (Obra) */
function enhanceObraResponsavelUI(existing){
  const form=document.getElementById('form');
  const respInput=form.querySelector("input[name='responsavel']");
  const telInput=form.querySelector("input[name='telefone']");
  if(!respInput || !telInput) return;
  const respDiv=respInput.closest('div');

  let hidden=form.querySelector("input[name='profissionalId']");
  if(!hidden){ hidden=document.createElement('input'); hidden.type='hidden'; hidden.name='profissionalId'; form.appendChild(hidden); }

  const profissionais=Array.isArray(db.profissionais)?db.profissionais:[];
  const currentId=existing && existing.profissionalId!=null ? String(existing.profissionalId) : '';
  const linked=currentId && profissionais.some(p=>String(p.id)===currentId);
  hidden.value = linked ? currentId : '';

  /* Entra DENTRO do mesmo campo "Responsável" já existente (mesmo label),
     em vez de criar um campo novo do lado — evita duplicar a informação. */
  let select=respDiv.querySelector('#respSelectUI');
  if(!select){
    select=document.createElement('select');
    select.id='respSelectUI';
    select.style.marginBottom='6px';
    respDiv.insertBefore(select, respInput);
  }
  select.innerHTML=`${profissionais.map(p=>`<option value="${esc(p.id)}" ${linked&&String(p.id)===currentId?'selected':''}>${esc(p.nome)}${p.servico?' — '+esc(p.servico):''}</option>`).join('')}<option value="__outro__" ${!linked?'selected':''}>Outro (não cadastrado — digitar manualmente)</option>`;

  let hint=respDiv.querySelector('.hint');
  if(!profissionais.length && !hint){
    respDiv.insertAdjacentHTML('beforeend',`<span class='hint'>Nenhum profissional cadastrado — escolha "Outro" e digite, ou cadastre em Profissionais.</span>`);
  }

  function applySelection(){
    const val=select.value;
    if(val && val!=='__outro__'){
      const prof=profissionais.find(p=>String(p.id)===val);
      hidden.value=val;
      respInput.value=prof?prof.nome:'';
      telInput.value=prof?(prof.telefone||''):'';
      respInput.readOnly=true; telInput.readOnly=true;
      respInput.style.display='none';
      telInput.style.background='#f2ece0';
    }else{
      hidden.value='';
      respInput.readOnly=false; telInput.readOnly=false;
      respInput.style.display=''; telInput.style.background='';
      if(val==='__outro__' && linked){ respInput.value=''; telInput.value=''; }
    }
  }
  select.addEventListener('change',applySelection);
  applySelection();
}

/* Mostra "Cartão · Nx de R$..." na listagem de Profissionais, sem
   afetar outras tabelas que também usam o campo "forma" (ex.: Pagamentos
   no Financeiro) — só entra em ação quando o registro tem valorParcela,
   campo que só existe em cadastros de Profissionais. */
const valFormaBase=val;
val=function(x,f){
  if(f==='forma' && x.forma==='Cartão' && x.valorParcela){
    return esc('Cartão · '+(parseInt(x.parcelas)||1)+'x de '+money(x.valorParcela));
  }
  return valFormaBase(x,f);
};

const openModalProfBase=openModal;
openModal=function(type,id=null){
  openModalProfBase(type,id);
  if(type==='obra'){
    const existing = id ? db.obra.find(x=>x.id===id) : null;
    enhanceObraResponsavelUI(existing);
  }
  if(type==='profissionais'){
    enhanceProfissionalFormaUI();
  }
};

/* Mostra Chave Pix só quando a forma de pagamento é Pix, e Parcelamento
   só quando é Cartão — os outros campos ficam escondidos e vazios para
   não salvar lixo (ex.: chave Pix presa de quando era Pix e trocou pra
   Cartão). */
function enhanceProfissionalFormaUI(){
  const form=document.getElementById('form');
  const formaSelect=form.querySelector("select[name='forma']");
  const pixInput=form.querySelector("input[name='chavePix']");
  const parcelasSelect=form.querySelector("select[name='parcelas']");
  const valorInput=form.querySelector("input[name='valor']");
  if(!formaSelect || !pixInput || !parcelasSelect) return;
  const pixDiv=pixInput.closest('div');
  const parcelasDiv=parcelasSelect.closest('div');

  let calcEl=parcelasDiv.querySelector('.parcela-calc');
  if(!calcEl){
    calcEl=document.createElement('span');
    calcEl.className='hint parcela-calc';
    calcEl.style.display='block'; calcEl.style.marginTop='6px';
    parcelasDiv.appendChild(calcEl);
  }

  function recalc(){
    const n=parseInt(parcelasSelect.value)||1;
    const total=valorInput?parseMoney(valorInput.value):0;
    calcEl.textContent = total>0 ? `${n}x de ${money(total/n)}` : 'Informe o Valor Total para calcular as parcelas.';
  }

  function apply(){
    const v=formaSelect.value;
    pixDiv.style.display = v==='Pix' ? '' : 'none';
    parcelasDiv.style.display = v==='Cartão' ? '' : 'none';
    if(v!=='Pix') pixInput.value='';
    if(v!=='Cartão') parcelasSelect.value='1x';
    if(v==='Cartão') recalc();
  }
  formaSelect.addEventListener('change',apply);
  parcelasSelect.addEventListener('change',recalc);
  if(valorInput) valorInput.addEventListener('input',recalc);
  apply();
}
</script>

<script id="v13-backup-restore">
/* V13.2 — Backup/Restauração completa do banco (todos os projetos).
   Adiciona um item próprio "Backup" no menu, no mesmo padrão de wrapper
   que o resto do arquivo já usa (não edita as funções originais). */
iconPaths.backup='<path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>';
{
  const idxConfig=menus.findIndex(m=>m[0]==='config');
  const item=['backup','Backup'];
  if(!menus.some(m=>m[0]==='backup')){
    if(idxConfig>=0)menus.splice(idxConfig,0,item);else menus.push(item);
  }
}
function exportFullBackup(){
  try{
    const payload={app:'norematiReforma',formato:'backup-completo',exportadoEm:new Date().toISOString(),dados:db};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href=url;a.download=`backup-reforma-${stamp}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){alert('Não foi possível gerar o backup: '+e.message)}
}
function importFullBackup(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    let parsed;
    try{parsed=JSON.parse(reader.result)}catch(e){alert('Arquivo inválido: não é um JSON válido.');input.value='';return}
    const incoming=(parsed&&typeof parsed==='object'&&parsed.dados)?parsed.dados:parsed;
    const pareceValido=incoming&&typeof incoming==='object'&&(Array.isArray(incoming.projects)||Array.isArray(incoming.obra));
    if(!pareceValido){alert('Este arquivo não parece ser um backup válido deste sistema.');input.value='';return}
    if(!confirm('Restaurar este backup vai SUBSTITUIR todos os dados atuais (todas as obras, financeiro, materiais, equipamentos etc.) pelos dados desse arquivo.\n\nEssa ação não pode ser desfeita. Deseja continuar?')){input.value='';return}
    db=incoming;
    try{
      if(typeof migrateProjectsSafe==='function')migrateProjectsSafe();
      if(typeof syncAliases==='function')syncAliases();
      if(typeof migrateChecklistUnificado==='function')migrateChecklistUnificado();
      if(typeof migrateObraResponsavelVinculo==='function')migrateObraResponsavelVinculo();
      if(typeof syncChecklistFromStages==='function')syncChecklistFromStages();
      if(typeof saveDB==='function')saveDB();else localStorage.setItem('norematiReforma',JSON.stringify(db));
    }catch(e){alert('O backup foi lido, mas houve um erro ao aplicá-lo: '+e.message);}
    input.value='';
    render();
    (typeof window.showToast==='function'?window.showToast('Backup restaurado com sucesso.','success'):alert('Backup restaurado com sucesso.'));
  };
  reader.onerror=()=>alert('Não foi possível ler o arquivo selecionado.');
  reader.readAsText(file);
}
render();
</script>

<script id="v136-form-validacao">
/* Validação mínima antes de salvar: bloqueia valores negativos e datas de
   término anteriores à de início. Roda antes de toda a cadeia de saveForm
   já existente — se algo for inválido, interrompe aqui e nem chama o resto. */
const MONEY_FIELDS_V136=['previsto','contratado','pago','valor','extra','unitario'];
const saveFormValidaBase=saveForm;
saveForm=function(){
  const form=document.getElementById('form');
  const type=editing.type;
  const fd=new FormData(form);
  const schema=schemas[type]||[];
  for(const [f,tp] of schema){
    const raw=fd.get(f);
    if(raw==null || raw==='') continue;
    let num=null;
    if(MONEY_FIELDS_V136.includes(f)) num=parseMoney(raw);
    else if(tp==='number') num=+raw;
    if(num!==null && !Number.isNaN(num) && num<0){
      alert('O campo "'+(labels[f]||f)+'" não pode ser negativo.');
      return;
    }
  }
  const ini=fd.get('inicio'), fim=fd.get('fim');
  if(ini && fim && fim<ini){
    alert('A data de término não pode ser anterior à data de início.');
    return;
  }
  saveFormValidaBase();
};
</script>

<script id="v137-obra-valor-vinculado">
/* Quando uma etapa está vinculada a um profissional e o Contratado/Pago da
   PRÓPRIA etapa está zerado, mostra na tabela de Obra o valor cadastrado no
   profissional em vez de "R$ 0,00" — só de exibição, não escreve nada na
   etapa nem duplica no cálculo de totals() (que já trata isso à parte).
   Assim dá pra ver o valor por etapa mesmo quando o custo real mora no
   cadastro de Profissionais. */
const valObraVinculadoBase=val;
val=function(x,f){
  if((f==='contratado'||f==='pago') && x.profissionalId!=null && !(+x[f]||0)){
    const prof=db.profissionais.find(p=>String(p.id)===String(x.profissionalId));
    if(prof){
      const raw=f==='contratado'?prof.valor:prof.pago;
      const v=+raw||0;
      if(v>0)return `${money(v)} <span class='hint' title="Valor cadastrado no profissional vinculado (${esc(prof.nome)}), não preenchido nesta etapa">(via profissional)</span>`;
    }
  }
  return valObraVinculadoBase(x,f);
};
/* A lista da tela "Obra" não mostrava Contratado/Pago nenhum (o desenho
   dela virou uma tabela de acompanhamento de prazo, não de custo) — por
   isso o valor "voltar a aparecer via val()" acima nunca era visto na
   prática: a tabela nem chama val() para esses campos. Acrescenta uma
   coluna "Custo" na própria tabela, resolvendo o mesmo jeito (campo da
   etapa OU valor do profissional vinculado quando o da etapa está zerado). */
function custoEtapaHtml(x){
  let contratado=+x.contratado||0,pago=+x.pago||0,via=false;
  if(x.profissionalId){
    const prof=db.profissionais.find(p=>String(p.id)===String(x.profissionalId));
    if(prof){
      if(!contratado && (+prof.valor||0)>0){contratado=+prof.valor||0;via=true;}
      if(!pago && (+prof.pago||0)>0){pago=+prof.pago||0;via=true;}
    }
  }
  return `${money(contratado)}<div class='hint'>Pago: ${money(pago)}${via?' · via profissional':''}</div>`;
}
</script>




<script id="v14-datamodel-v2">
/* ==========================================================================
   V14 — Reestruturação do modelo de custos (profissionais / materiais /
   equipamentos sempre vinculados a uma etapa da Obra).

   Problema corrigido: um profissional (ex.: "Antonio") vinculado a MAIS DE
   UMA etapa fazia o cálculo de "Mão de obra" no resumo financeiro somar
   errado (podendo até zerar), porque o modelo antigo guardava
   Contratado/Pago tanto na etapa quanto (às vezes) no cadastro do
   profissional, e a função profissionaisAvulsos() só sabia lidar com um
   profissional vinculado a UMA etapa.

   Modelo novo (definido com a cliente):
   - db.trabalhos: um vínculo de trabalho por (profissional, etapa), com
     valor cobrado, valor pago, forma de pagamento e status PRÓPRIOS desse
     vínculo. Um profissional pode ter vários vínculos (um por etapa).
   - Etapa (db.obra): Custo, Pago e Responsável deixam de ser digitados —
     passam a ser CALCULADOS a partir da soma de todos os vínculos de
     profissional + materiais + equipamentos daquela etapa.
   - Materiais e Equipamentos: etapaId agora é OBRIGATÓRIO — nada de custo
     "avulso" solto sem etapa.
   - Resumo financeiro, KPIs do topo e barra de utilização do orçamento
     passam a ler sempre dessas somas — nunca mais de um campo solto.
   ========================================================================== */
(function () {
  "use strict";

  /* ------------------------------------------------------------------ *
   * 1) MIGRAÇÃO DE DADOS (roda uma única vez por navegador)
   * ------------------------------------------------------------------ */
  function ensureTrabalhosArrays() {
    if (typeof PROJECT_KEYS !== "undefined" && !PROJECT_KEYS.includes("trabalhos")) {
      PROJECT_KEYS.push("trabalhos");
    }
    if (Array.isArray(db.projects)) {
      db.projects.forEach((p) => {
        if (!Array.isArray(p.trabalhos)) p.trabalhos = [];
      });
    }
    if (!Array.isArray(db.trabalhos)) db.trabalhos = [];
  }

  function migrateProjectV2(p, warnings) {
    p.trabalhos = Array.isArray(p.trabalhos) ? p.trabalhos : [];
    const obra = Array.isArray(p.obra) ? p.obra : [];
    const profissionais = Array.isArray(p.profissionais) ? p.profissionais : [];
    const materiais = Array.isArray(p.materiais) ? p.materiais : [];
    const equipamentos = Array.isArray(p.equipamentos) ? p.equipamentos : [];

    /* 1a) Etapa com profissionalId direto -> cria um vínculo/trabalho
       usando o contratado/pago da PRÓPRIA etapa como valor desse vínculo. */
    obra.forEach((etapa) => {
      if (etapa.profissionalId) {
        const jaMigrado = p.trabalhos.some(
          (t) => t._migradoDeEtapaId != null && String(t._migradoDeEtapaId) === String(etapa.id),
        );
        if (!jaMigrado) {
          p.trabalhos.push({
            id: "mig_" + etapa.id + "_" + Math.random().toString(36).slice(2, 8),
            profissionalId: etapa.profissionalId,
            etapaId: etapa.id,
            valor: +etapa.contratado || 0,
            pago: +etapa.pago || 0,
            forma: "Pix",
            chavePix: "",
            parcelas: "1x",
            valorParcela: null,
            status:
              etapa.status === "Concluído"
                ? "Concluído"
                : etapa.status === "Contratado" || etapa.status === "Em andamento"
                  ? "Contratado"
                  : "Cotação",
            _migradoDeEtapaId: etapa.id,
          });
        }
      }
      /* Campos que saem do modelo de etapa (viram calculados). Preserva o
         valor antigo em chave "_legado" só por segurança/depuração — nunca
         apagado, apenas deixa de ser lido pelo app. */
      if (etapa.contratado !== undefined || etapa.pago !== undefined || etapa.previsto !== undefined) {
        etapa._legadoV1 = {
          previsto: etapa.previsto,
          contratado: etapa.contratado,
          pago: etapa.pago,
          responsavel: etapa.responsavel,
          telefone: etapa.telefone,
        };
      }
      etapa.profissionalId = null;
      delete etapa.previsto;
      delete etapa.contratado;
      delete etapa.pago;
    });

    /* 1b) Profissional com valor/pago cadastrado direto mas SEM nenhuma
       etapa vinculada: não há como migrar automaticamente (não existe
       etapa correta pra usar) — preserva o valor antigo e sinaliza. */
    profissionais.forEach((prof) => {
      const temVinculo = p.trabalhos.some((t) => String(t.profissionalId) === String(prof.id));
      const valorAntigo = +prof.valor || 0;
      const pagoAntigo = +prof.pago || 0;
      if (!temVinculo && (valorAntigo > 0 || pagoAntigo > 0)) {
        warnings.push(
          `Profissional "${prof.nome || "(sem nome)"}" tinha valor cadastrado (R$ ${valorAntigo.toFixed(2)}) sem nenhuma etapa vinculada. Não foi migrado automaticamente — crie o vínculo manualmente em Profissionais.`,
        );
        prof._valorLegadoV1 = valorAntigo;
        prof._pagoLegadoV1 = pagoAntigo;
      }
      delete prof.valor;
      delete prof.pago;
      delete prof.forma;
      delete prof.chavePix;
      delete prof.parcelas;
      delete prof.valorParcela;
    });

    /* 1c) Materiais/Equipamentos sem etapa vinculada: tenta achar por
       categoria ou por nome batendo; se não achar, deixa pendente e avisa
       (nunca apaga). */
    function acharEtapaPara(item) {
      let found = obra.find(
        (e) =>
          e.categoria &&
          item.categoria &&
          String(e.categoria).trim().toLowerCase() === String(item.categoria).trim().toLowerCase(),
      );
      if (!found && item.nome) {
        const alvo = String(item.nome).toLowerCase();
        found = obra.find(
          (e) => e.nome && (alvo.includes(String(e.nome).toLowerCase()) || String(e.nome).toLowerCase().includes(alvo)),
        );
      }
      return found || null;
    }
    materiais.forEach((m) => {
      if (!m.etapaId) {
        const found = acharEtapaPara(m);
        if (found) m.etapaId = found.id;
        else {
          m.etapaId = null;
          warnings.push(`Material "${m.nome || "(sem nome)"}" está sem etapa vinculada — revise em Materiais.`);
        }
      }
      delete m.entregue;
    });
    equipamentos.forEach((eq) => {
      if (!eq.etapaId) {
        const found = acharEtapaPara(eq);
        if (found) eq.etapaId = found.id;
        else {
          eq.etapaId = null;
          warnings.push(`Equipamento "${eq.nome || "(sem nome)"}" está sem etapa vinculada — revise em Equipamentos.`);
        }
      }
    });
  }

  function runMigrationV2() {
    if (!Array.isArray(db.projects)) return;
    const warnings = [];
    db.projects.forEach((p) => migrateProjectV2(p, warnings));
    db._migrationPending = warnings;
    db._migratedV2 = true;
    if (warnings.length) {
      console.warn("[migração v2 — Noremati] " + warnings.length + " item(ns) precisam de revisão:", warnings);
    }
  }

  ensureTrabalhosArrays();
  if (!db._migratedV2) runMigrationV2();
  if (typeof syncAliases === "function") syncAliases();
  if (typeof saveDB === "function") saveDB();
  else localStorage.setItem("norematiReforma", JSON.stringify(db));

  /* ------------------------------------------------------------------ *
   * 2) HELPERS DE CÁLCULO (fonte única da verdade)
   * ------------------------------------------------------------------ */
  window.trabalhosDaEtapa = function (etapaId) {
    return (db.trabalhos || []).filter((t) => String(t.etapaId) === String(etapaId));
  };
  window.trabalhosDoProfissional = function (profId) {
    return (db.trabalhos || []).filter((t) => String(t.profissionalId) === String(profId));
  };
  window.materiaisDaEtapa = function (etapaId) {
    return (db.materiais || []).filter((m) => String(m.etapaId) === String(etapaId));
  };
  window.equipamentosDaEtapa = function (etapaId) {
    return (db.equipamentos || []).filter((e) => String(e.etapaId) === String(etapaId));
  };
  window.custoEtapa = function (etapa) {
    const trabs = trabalhosDaEtapa(etapa.id);
    const mats = materiaisDaEtapa(etapa.id);
    const eqs = equipamentosDaEtapa(etapa.id);
    const contratado =
      trabs.reduce((a, t) => a + (+t.valor || 0), 0) +
      mats.reduce((a, m) => a + materialTotal(m), 0) +
      eqs.reduce((a, e) => a + (+e.valor || 0), 0);
    const pago = trabs.reduce((a, t) => a + (+t.pago || 0), 0) + mats.reduce((a, m) => a + (+m.pago || 0), 0);
    return { contratado, pago };
  };
  window.profissionaisResponsaveisEtapa = function (etapaId) {
    const ids = [...new Set(trabalhosDaEtapa(etapaId).map((t) => String(t.profissionalId)))];
    return ids.map((id) => (db.profissionais || []).find((p) => String(p.id) === id)).filter(Boolean);
  };
  window.valorTotalProfissional = function (profId) {
    return trabalhosDoProfissional(profId).reduce((a, t) => a + (+t.valor || 0), 0);
  };
  window.valorPagoProfissional = function (profId) {
    return trabalhosDoProfissional(profId).reduce((a, t) => a + (+t.pago || 0), 0);
  };

  /* totals(): substitui de vez a lógica de "profissionaisAvulsos()" —
     agora soma direto TODOS os vínculos de trabalho, então não importa
     quantas etapas um mesmo profissional tenha: cada vínculo entra uma
     única vez, sem risco de duplicar nem de zerar. */
  totals = function () {
    const materiaisTotal = db.materiais.reduce((a, x) => a + materialTotal(x), 0);
    const materiaisPago = db.materiais.reduce((a, x) => a + (+x.pago || 0), 0);
    const maoDeObra = (db.trabalhos || []).reduce((a, x) => a + (+x.valor || 0), 0);
    const maoDeObraPago = (db.trabalhos || []).reduce((a, x) => a + (+x.pago || 0), 0);
    const eq = db.equipamentos.reduce((a, x) => a + (+x.valor || 0), 0);
    const adm = db.admin.reduce((a, x) => a + (+x.pago || 0), 0);
    const extras = typeof unforeseenTotal === "function" ? unforeseenTotal() : 0;
    const contratado = maoDeObra + materiaisTotal + eq;
    const pago = maoDeObraPago + materiaisPago;
    const prog = db.obra.length
      ? Math.round(db.obra.reduce((a, x) => a + (+x.progresso || 0), 0) / db.obra.length)
      : 0;
    return {
      previsto: contratado,
      contratado,
      pago,
      apagar: Math.max(0, contratado - pago),
      eq,
      adm,
      prog,
      materiais: materiaisTotal,
      maoDeObra,
      maoDeObraPago,
      extras,
    };
  };

  /* Comparativo por categoria (Financeiro): antes somava x.contratado da
     etapa E o valor dos materiais separadamente — com materiais sempre
     vinculados a uma etapa isso duplicaria o custo. Agora soma só o custo
     calculado de cada etapa (que já inclui materiais e equipamentos). */
  categoryStats = function () {
    const m = {};
    db.obra.forEach((x) => {
      const k = x.categoria || "Outros";
      m[k] = m[k] || { prev: 0, real: 0 };
      const c = custoEtapa(x);
      m[k].real += c.contratado;
      m[k].prev += c.contratado; /* não existe mais "previsto" separado no novo modelo */
    });
    return m;
  };

  custoEtapaHtml = function (x) {
    const c = custoEtapa(x);
    return `${money(c.contratado)}<div class='hint'>Pago: ${money(c.pago)}</div>`;
  };
  function responsavelEtapaHtml(x) {
    const resp = profissionaisResponsaveisEtapa(x.id);
    if (!resp.length) return `<span class='hint'>Sem profissional vinculado</span>`;
    return resp
      .map((p) => `<div><b>${esc(p.nome)}</b><div class='hint'>${esc(p.telefone || "sem telefone")}</div></div>`)
      .join("");
  }

  /* ------------------------------------------------------------------ *
   * 3) SCHEMAS (documentação / fallback) — os formulários reais destes
   *    5 tipos são construídos à mão logo abaixo (precisam de <select>
   *    dinâmicos apontando pra Obra/Profissionais, que o sistema de
   *    schema genérico antigo não suporta).
   * ------------------------------------------------------------------ */
  const CATEGORIAS_OBRA =
    "Demolição|Alvenaria|Elétrica|Hidráulica|Iluminação|Pintura|Piso|Climatização|Limpeza|Acabamentos|Imprevistos";
  const CATEGORIAS_MATERIAL =
    "Demolição|Alvenaria|Elétrica|Hidráulica|Iluminação|Pintura|Piso|Climatização|Banheiros|Acabamentos|Limpeza|Ferragens e fixação|Outros";
  const STATUS_OBRA = "Não iniciado|Cotação|Contratado|Em andamento|Bloqueado|Concluído";
  const PRIORIDADES = "Crítica|Alta|Média|Baixa";
  const UNIDADES = "un|m²|m|kg|L|caixa|pacote";
  const STATUS_MATERIAL = "Pendente|Comprado|Entregue";
  const STATUS_EQUIPAMENTO = "Comprado|Aguardando entrega|Entregue|Montado";
  const STATUS_TRABALHO = "Cotação|Contratado|Em andamento|Concluído";
  const FORMAS_PAGAMENTO = "Pix|Cartão|Em Dinheiro";
  const PARCELAS_OPTS = "1x|2x|3x|4x|5x|6x|7x|8x|9x|10x|11x|12x";

  schemas.obra = [
    ["nome", "text"],
    ["categoria", "select", CATEGORIAS_OBRA],
    ["prioridade", "select", PRIORIDADES],
    ["dependencia", "text"],
    ["inicio", "date"],
    ["fim", "date"],
    ["status", "select", STATUS_OBRA],
    ["progresso", "number"],
    ["observacao", "textarea"],
  ];
  schemas.profissionais = [
    ["nome", "text"],
    ["email", "text"],
    ["telefone", "text"],
    ["servico", "text"],
    ["status", "select", STATUS_TRABALHO],
  ];
  schemas.materiais = [
    ["nome", "text"],
    ["categoria", "select", CATEGORIAS_MATERIAL],
    ["fornecedor", "text"],
    ["quantidade", "number"],
    ["unidade", "select", UNIDADES],
    ["unitario", "number"],
    ["pago", "number"],
    ["data", "date"],
    ["status", "select", STATUS_MATERIAL],
  ];
  schemas.equipamentos = [
    ["nome", "text"],
    ["quantidade", "number"],
    ["valor", "number"],
    ["fornecedorNome", "text"],
    ["fornecedorEmail", "text"],
    ["fornecedorTelefone", "text"],
    ["forma", "select", FORMAS_PAGAMENTO],
    ["compra", "date"],
    ["entrega", "date"],
    ["status", "select", STATUS_EQUIPAMENTO],
  ];
  schemas.trabalhos = [
    ["profissionalId", "text"],
    ["etapaId", "text"],
    ["valor", "number"],
    ["pago", "number"],
    ["forma", "select", FORMAS_PAGAMENTO],
    ["status", "select", STATUS_TRABALHO],
  ];
  Object.assign(labels, {
    email: "E-mail",
    servico: "Serviço prestado",
    etapaId: "Etapa vinculada",
    profissionalId: "Profissional",
    fornecedorNome: "Fornecedor (nome)",
    fornecedorEmail: "Fornecedor (e-mail)",
    fornecedorTelefone: "Fornecedor (telefone)",
  });

  /* ------------------------------------------------------------------ *
   * 4) FORM BUILDERS (HTML dos 5 modais reformulados)
   * ------------------------------------------------------------------ */
  function fSelect(name, label, optsStr, selected) {
    return `<div><label>${label}</label><select name='${name}'>${optsStr
      .split("|")
      .map((o) => `<option ${String(selected) === o ? "selected" : ""}>${o}</option>`)
      .join("")}</select></div>`;
  }
  function fText(name, label, v, type) {
    return `<div><label>${label}</label><input name='${name}' type='${type || "text"}' value='${esc(v ?? "")}'></div>`;
  }
  function fMoney(name, label, v) {
    return `<div class='moneyinput'><label>${label}</label><input name='${name}' class='currency-input' type='text' inputmode='numeric' value='${moneyInput(v || 0)}' placeholder='0,00'></div>`;
  }
  function fTextarea(name, label, v) {
    return `<div class='full'><label>${label}</label><textarea name='${name}' rows='3'>${esc(v || "")}</textarea></div>`;
  }
  function fEtapaSelect(name, selected) {
    const opts = (db.obra || [])
      .map((e) => `<option value='${e.id}' ${String(selected) === String(e.id) ? "selected" : ""}>${esc(e.nome)}</option>`)
      .join("");
    return `<div class='full'><label>Etapa vinculada *</label><select name='${name}'><option value=''>Selecione a etapa…</option>${opts}</select><span class='hint'>Obrigatório — todo custo precisa estar ligado a uma etapa da Obra.</span></div>`;
  }
  function fProfSelect(name, selected) {
    const opts = (db.profissionais || [])
      .map(
        (p) =>
          `<option value='${p.id}' ${String(selected) === String(p.id) ? "selected" : ""}>${esc(p.nome)}${p.servico ? " — " + esc(p.servico) : ""}</option>`,
      )
      .join("");
    return `<div><label>Profissional *</label><select name='${name}'><option value=''>Selecione o profissional…</option>${opts}</select></div>`;
  }

  function vinculosDaEtapaHtml(etapa) {
    const trabs = trabalhosDaEtapa(etapa.id);
    const c = custoEtapa(etapa);
    const resp = profissionaisResponsaveisEtapa(etapa.id);
    return `<div class='full'><label>Responsável (derivado dos vínculos)</label><div class='mini-note'>${
      resp.length
        ? resp.map((p) => `<div><b>${esc(p.nome)}</b> — ${esc(p.telefone || "sem telefone")}</div>`).join("")
        : "Nenhum profissional vinculado ainda."
    }</div></div>
    <div class='full'><label>Custo calculado (profissionais + materiais + equipamentos vinculados)</label><div class='mini-note'><b>Contratado:</b> ${money(c.contratado)} &nbsp;&nbsp; <b>Pago:</b> ${money(c.pago)}</div></div>
    <div class='full'><div class='toolbar'><b>Vínculos de profissionais nesta etapa</b><button type='button' class='btn secondary' onclick="openModal('trabalhos', null, '${etapa.id}')">+ Vincular profissional</button></div>${
      trabs.length
        ? trabs
            .map((t) => {
              const p = (db.profissionais || []).find((pp) => String(pp.id) === String(t.profissionalId));
              return `<div class='mini-note' style='margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px'><span>${esc(p ? p.nome : "profissional excluído")} — ${money(t.valor)} (pago ${money(t.pago)}) · ${esc(t.status || "")}</span><span class='rowactions'><button type='button' onclick="openModal('trabalhos','${t.id}')">Editar</button> <button type='button' onclick="delFromModal('trabalhos','${t.id}','obra',${etapa.id})">Excluir</button></span></div>`;
            })
            .join("")
        : `<div class='hint'>Nenhum vínculo ainda.</div>`
    }</div>
    <div class='full'><div class='toolbar'><b>Materiais desta etapa</b><button type='button' class='btn secondary' onclick="openModal('materiais', null, '${etapa.id}')">+ Adicionar material</button></div>${
      materiaisDaEtapa(etapa.id).length
        ? materiaisDaEtapa(etapa.id)
            .map(
              (m) =>
                `<div class='mini-note' style='margin-top:6px'>${esc(m.nome)} — ${money(materialTotal(m))} <span class='rowactions'><button type='button' onclick="openModal('materiais','${m.id}')">Editar</button></span></div>`,
            )
            .join("")
        : `<div class='hint'>Nenhum material vinculado ainda.</div>`
    }</div>
    <div class='full'><div class='toolbar'><b>Equipamentos desta etapa</b><button type='button' class='btn secondary' onclick="openModal('equipamentos', null, '${etapa.id}')">+ Adicionar equipamento</button></div>${
      equipamentosDaEtapa(etapa.id).length
        ? equipamentosDaEtapa(etapa.id)
            .map(
              (e) =>
                `<div class='mini-note' style='margin-top:6px'>${esc(e.nome)} — ${money(e.valor)} <span class='rowactions'><button type='button' onclick="openModal('equipamentos','${e.id}')">Editar</button></span></div>`,
            )
            .join("")
        : `<div class='hint'>Nenhum equipamento vinculado ainda.</div>`
    }</div>`;
  }

  function buildObraFormHtml(x, id) {
    let html =
      fText("nome", "Nome", x.nome) +
      (typeof categoriaFieldHtml === "function"
        ? categoriaFieldHtml("obra", x.categoria)
        : fSelect("categoria", "Categoria", (db.categoriasObra && db.categoriasObra.length ? db.categoriasObra.join("|") : CATEGORIAS_OBRA), x.categoria)) +
      fSelect("prioridade", "Prioridade", PRIORIDADES, x.prioridade || "Média") +
      fText("dependencia", "Depende de (etapa anterior)", x.dependencia) +
      fText("inicio", "Início", x.inicio, "date") +
      fText("fim", "Fim previsto", x.fim, "date") +
      fSelect("status", "Situação", STATUS_OBRA, x.status || "Não iniciado") +
      `<div><label>Progresso (%)</label><input name='progresso' id='obraProgressoInput' type='number' min='0' max='100' value='${x.progresso || 0}'></div>` +
      fTextarea("observacao", "Observações", x.observacao);
    if (id != null) html += vinculosDaEtapaHtml(x);
    return html;
  }

  function trabalhosDoProfissionalHtml(prof) {
    const trabs = trabalhosDoProfissional(prof.id);
    return `<div class='full'><label>Totais (soma de todos os vínculos)</label><div class='mini-note'><b>Valor Total:</b> ${money(valorTotalProfissional(prof.id))} &nbsp;&nbsp; <b>Valor Pago:</b> ${money(valorPagoProfissional(prof.id))}</div></div>
    <div class='full'><div class='toolbar'><b>Trabalhos / vínculos deste profissional</b><button type='button' class='btn secondary' onclick="openModal('trabalhos', null, null, '${prof.id}')">+ Adicionar vínculo</button></div>${
      trabs.length
        ? trabs
            .map((t) => {
              const e = (db.obra || []).find((ee) => String(ee.id) === String(t.etapaId));
              return `<div class='mini-note' style='margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px'><span>${esc(e ? e.nome : "etapa excluída")} — ${money(t.valor)} (pago ${money(t.pago)}) · ${esc(t.status || "")}</span><span class='rowactions'><button type='button' onclick="openModal('trabalhos','${t.id}')">Editar</button> <button type='button' onclick="delFromModal('trabalhos','${t.id}','profissionais',${prof.id})">Excluir</button></span></div>`;
            })
            .join("")
        : `<div class='hint'>Nenhum vínculo ainda — este profissional ainda não está ligado a nenhuma etapa.</div>`
    }</div>`;
  }

  function buildProfissionalFormHtml(x, id) {
    let html =
      fText("nome", "Nome Completo", x.nome) +
      fText("email", "E-mail", x.email, "email") +
      fText("telefone", "Telefone", x.telefone) +
      fText("servico", "Serviço prestado", x.servico) +
      fSelect("status", "Status", STATUS_TRABALHO, x.status || "Cotação");
    if (id != null) html += trabalhosDoProfissionalHtml(x);
    return html;
  }

  function buildMaterialFormHtml(x) {
    return (
      fText("nome", "Nome do Item", x.nome) +
      (typeof categoriaFieldHtml === "function"
        ? categoriaFieldHtml("material", x.categoria)
        : fSelect("categoria", "Categoria", (db.categoriasMaterial && db.categoriasMaterial.length ? db.categoriasMaterial.join("|") : CATEGORIAS_MATERIAL), x.categoria)) +
      (typeof fFornecedorSelect === "function" ? fFornecedorSelect("fornecedorId", x.fornecedorId) : fText("fornecedor", "Fornecedor", x.fornecedor)) +
      `<div><label>Quantidade</label><input name='quantidade' type='number' min='0' step='0.01' value='${x.quantidade ?? 1}'></div>` +
      fSelect("unidade", "Unidade", UNIDADES, x.unidade || "un") +
      fMoney("unitario", "Valor Unitário (R$)", x.unitario) +
      fMoney("pago", "Valor pago (R$)", x.pago) +
      fText("data", "Data da compra", x.data, "date") +
      fSelect("status", "Status", STATUS_MATERIAL, x.status || "Pendente") +
      fEtapaSelect("etapaId", x.etapaId)
    );
  }

  function buildEquipamentoFormHtml(x) {
    return (
      fText("nome", "Nome do aparelho", x.nome) +
      `<div><label>Quantidade</label><input name='quantidade' type='number' min='0' value='${x.quantidade ?? 1}'></div>` +
      fMoney("valor", "Valor total (R$)", x.valor) +
      (typeof fFornecedorSelect === "function"
        ? fFornecedorSelect("fornecedorId", x.fornecedorId)
        : fText("fornecedorNome", "Fornecedor (nome)", x.fornecedorNome) +
          fText("fornecedorEmail", "Fornecedor (e-mail)", x.fornecedorEmail, "email") +
          fText("fornecedorTelefone", "Fornecedor (telefone)", x.fornecedorTelefone)) +
      fSelect("forma", "Forma de pagamento", FORMAS_PAGAMENTO, x.forma || "Pix") +
      `<div><label>Chave Pix</label><input name='chavePix' value='${esc(x.chavePix || "")}'></div>` +
      fSelect("parcelas", "Parcelamento", PARCELAS_OPTS, x.parcelas || "1x") +
      fText("compra", "Data de compra", x.compra, "date") +
      fText("entrega", "Data de entrega", x.entrega, "date") +
      fSelect("status", "Status", STATUS_EQUIPAMENTO, x.status || "Comprado") +
      fEtapaSelect("etapaId", x.etapaId)
    );
  }

  function buildTrabalhoFormHtml(x) {
    return (
      fProfSelect("profissionalId", x.profissionalId) +
      fEtapaSelect("etapaId", x.etapaId) +
      fMoney("valor", "Valor cobrado (R$)", x.valor) +
      fMoney("pago", "Valor pago (R$)", x.pago) +
      fSelect("forma", "Forma de pagamento", FORMAS_PAGAMENTO, x.forma || "Pix") +
      `<div><label>Chave Pix</label><input name='chavePix' value='${esc(x.chavePix || "")}'></div>` +
      fSelect("parcelas", "Parcelamento", PARCELAS_OPTS, x.parcelas || "1x") +
      fSelect("status", "Status", STATUS_TRABALHO, x.status || "Cotação")
    );
  }

  const CUSTOM_MODAL_TYPES = ["obra", "profissionais", "materiais", "equipamentos", "trabalhos"];
  function buildCustomFormHtml(type, x, id) {
    if (type === "obra") return buildObraFormHtml(x, id);
    if (type === "profissionais") return buildProfissionalFormHtml(x, id);
    if (type === "materiais") return buildMaterialFormHtml(x);
    if (type === "equipamentos") return buildEquipamentoFormHtml(x);
    if (type === "trabalhos") return buildTrabalhoFormHtml(x);
    return "";
  }

  const PROGRESSO_SUGERIDO_POR_STATUS = {
    "Não iniciado": 0,
    "Cotação": 20,
    "Contratado": 40,
    "Em andamento": 50,
    "Concluído": 100,
    // "Bloqueado" fica de fora de propósito: bloqueado pode acontecer em
    // qualquer % de execução real, então não sobrescrevemos o progresso já
    // registrado quando a etapa é marcada como bloqueada.
  };

  function wireDynamicFormBehaviors(type) {
    if (type === "obra") {
      const form = document.getElementById("form");
      const statusSelect = form.querySelector("select[name='status']");
      const progressoInput = document.getElementById("obraProgressoInput");
      if (statusSelect && progressoInput) {
        statusSelect.addEventListener("change", () => {
          const sugestao = PROGRESSO_SUGERIDO_POR_STATUS[statusSelect.value];
          if (sugestao != null) progressoInput.value = sugestao;
        });
      }
      return;
    }
    if (type !== "trabalhos" && type !== "equipamentos") return;
    const form = document.getElementById("form");
    const formaSelect = form.querySelector("select[name='forma']");
    const pixInput = form.querySelector("input[name='chavePix']");
    const parcelasSelect = form.querySelector("select[name='parcelas']");
    if (!formaSelect) return;
    const pixDiv = pixInput ? pixInput.closest("div") : null;
    const parcelasDiv = parcelasSelect ? parcelasSelect.closest("div") : null;
    function apply() {
      const v = formaSelect.value;
      if (pixDiv) pixDiv.style.display = v === "Pix" ? "" : "none";
      if (parcelasDiv) parcelasDiv.style.display = v === "Cartão" ? "" : "none";
    }
    formaSelect.addEventListener("change", apply);
    apply();
  }

  /* ------------------------------------------------------------------ *
   * 5) openModal / saveForm / del — camada final (intercepta os 5 tipos
   *    reformulados; delega o resto para a cadeia já existente).
   * ------------------------------------------------------------------ */
  const openModalBaseV14 = openModal;
  openModal = function (type, id, presetEtapaId, presetProfId) {
    id = id == null ? null : id;
    if (!CUSTOM_MODAL_TYPES.includes(type)) return openModalBaseV14(type, id);
    editing = { type, id };
    let x = id != null ? db[type].find((i) => String(i.id) === String(id)) : {};
    if (!x) x = {};
    if (id == null) {
      x = { ...x };
      if (presetEtapaId) x.etapaId = presetEtapaId;
      if (presetProfId) x.profissionalId = presetProfId;
    }
    document.getElementById("modalTitle").textContent = id != null ? "Editar registro" : "Novo registro";
    document.getElementById("form").innerHTML = buildCustomFormHtml(type, x, id);
    document.querySelector(".modalbox .actions").innerHTML =
      "<button class='btn secondary' onclick='closeModal(false)'>Cancelar</button><button class='btn' onclick='saveForm()'>Salvar</button>";
    document.getElementById("modal").classList.add("show");
    bindMoneyInputs(document.getElementById("form"));
    wireDynamicFormBehaviors(type);
  };

  function collectFormData() {
    return Object.fromEntries(new FormData(document.getElementById("form")).entries());
  }
  function persistProjectAndRender(types) {
    const p = typeof curP === "function" ? curP() : null;
    if (p) types.forEach((t) => (p[t] = db[t]));
    if (typeof saveDB === "function") saveDB();
    else localStorage.setItem("norematiReforma", JSON.stringify(db));
    render();
  }
  function upsert(type, data) {
    if (editing.id != null) {
      const i = db[type].findIndex((x) => String(x.id) === String(editing.id));
      if (i >= 0) db[type][i] = { ...db[type][i], ...data };
      else db[type].push({ ...data, id: editing.id });
    } else {
      data.id =
        type === "trabalhos" ? "t_" + Date.now() + "_" + Math.floor(Math.random() * 10000) : Date.now() + Math.floor(Math.random() * 1000);
      db[type].push(data);
    }
  }

  const saveFormBaseV14 = saveForm;
  saveForm = function () {
    const typ = editing && editing.type;
    if (!CUSTOM_MODAL_TYPES.includes(typ)) return saveFormBaseV14();
    const d = collectFormData();

    if (typ === "obra") {
      if (!d.nome || !d.nome.trim()) {
        alert("Informe o nome da etapa.");
        return;
      }
      if (d.inicio && d.fim && d.fim < d.inicio) {
        alert("A data de término não pode ser anterior à data de início.");
        return;
      }
      const prog = +d.progresso || 0;
      if (prog < 0 || prog > 100) {
        alert("Progresso deve estar entre 0 e 100.");
        return;
      }
      upsert("obra", {
        nome: d.nome.trim(),
        categoria: d.categoria,
        prioridade: d.prioridade,
        dependencia: d.dependencia || "",
        inicio: d.inicio || "",
        fim: d.fim || "",
        status: d.status,
        progresso: prog,
        observacao: d.observacao || "",
      });
      persistProjectAndRender(["obra"]);
      if (typeof syncChecklistFromStages === "function") syncChecklistFromStages();
      closeModal();
      return;
    }

    if (typ === "profissionais") {
      if (!d.nome || !d.nome.trim()) {
        alert("Informe o nome completo do profissional.");
        return;
      }
      upsert("profissionais", {
        nome: d.nome.trim(),
        email: d.email || "",
        telefone: d.telefone || "",
        servico: d.servico || "",
        status: d.status,
      });
      persistProjectAndRender(["profissionais"]);
      closeModal();
      return;
    }

    if (typ === "materiais") {
      if (!d.etapaId) {
        alert("Selecione a etapa vinculada. Todo material precisa estar ligado a uma etapa da Obra.");
        return;
      }
      if (!d.nome || !d.nome.trim()) {
        alert("Informe o nome do item.");
        return;
      }
      const quantidade = +d.quantidade || 0,
        unitario = parseMoney(d.unitario),
        pago = parseMoney(d.pago);
      if (quantidade < 0 || unitario < 0 || pago < 0) {
        alert("Valores não podem ser negativos.");
        return;
      }
      const fornObjMat = d.fornecedorId ? (db.fornecedores || []).find((f) => String(f.id) === String(d.fornecedorId)) : null;
      upsert("materiais", {
        nome: d.nome.trim(),
        categoria: d.categoria,
        fornecedor: fornObjMat ? fornObjMat.nome : d.fornecedor || "",
        fornecedorId: d.fornecedorId || "",
        quantidade,
        unidade: d.unidade,
        unitario,
        valor: quantidade * unitario,
        pago,
        data: d.data || "",
        status: d.status,
        etapaId: d.etapaId,
      });
      persistProjectAndRender(["materiais"]);
      closeModal();
      return;
    }

    if (typ === "equipamentos") {
      if (!d.etapaId) {
        alert("Selecione a etapa vinculada. Todo equipamento precisa estar ligado a uma etapa da Obra.");
        return;
      }
      if (!d.nome || !d.nome.trim()) {
        alert("Informe o nome do aparelho.");
        return;
      }
      const quantidade = +d.quantidade || 0,
        valor = parseMoney(d.valor);
      if (quantidade < 0 || valor < 0) {
        alert("Valores não podem ser negativos.");
        return;
      }
      if (d.compra && d.entrega && d.entrega < d.compra) {
        alert("A data de entrega não pode ser anterior à data de compra.");
        return;
      }
      const n = parseInt(d.parcelas) || 1;
      const fornObjEq = d.fornecedorId ? (db.fornecedores || []).find((f) => String(f.id) === String(d.fornecedorId)) : null;
      upsert("equipamentos", {
        nome: d.nome.trim(),
        quantidade,
        valor,
        fornecedorId: d.fornecedorId || "",
        fornecedorNome: fornObjEq ? fornObjEq.nome : d.fornecedorNome || "",
        fornecedorEmail: fornObjEq ? fornObjEq.email : d.fornecedorEmail || "",
        fornecedorTelefone: fornObjEq ? fornObjEq.telefone : d.fornecedorTelefone || "",
        forma: d.forma,
        chavePix: d.forma === "Pix" ? d.chavePix || "" : "",
        parcelas: d.forma === "Cartão" ? d.parcelas : "1x",
        valorParcela: d.forma === "Cartão" && valor > 0 ? valor / n : null,
        compra: d.compra || "",
        entrega: d.entrega || "",
        status: d.status,
        etapaId: d.etapaId,
      });
      persistProjectAndRender(["equipamentos"]);
      closeModal();
      return;
    }

    if (typ === "trabalhos") {
      if (!d.profissionalId) {
        alert("Selecione o profissional.");
        return;
      }
      if (!d.etapaId) {
        alert("Selecione a etapa vinculada. Todo vínculo de trabalho precisa estar ligado a uma etapa da Obra.");
        return;
      }
      const valor = parseMoney(d.valor),
        pago = parseMoney(d.pago);
      if (valor < 0 || pago < 0) {
        alert("Valores não podem ser negativos.");
        return;
      }
      const n = parseInt(d.parcelas) || 1;
      upsert("trabalhos", {
        profissionalId: d.profissionalId,
        etapaId: d.etapaId,
        valor,
        pago,
        forma: d.forma,
        chavePix: d.forma === "Pix" ? d.chavePix || "" : "",
        parcelas: d.forma === "Cartão" ? d.parcelas : "1x",
        valorParcela: d.forma === "Cartão" && valor > 0 ? valor / n : null,
        status: d.status,
      });
      persistProjectAndRender(["trabalhos"]);
      closeModal();
      return;
    }
  };

  function finishDelSync(type) {
    const p = typeof curP === "function" ? curP() : null;
    if (p) {
      p[type] = db[type];
      if (type === "obra") {
        p.materiais = db.materiais;
        p.equipamentos = db.equipamentos;
        p.trabalhos = db.trabalhos;
      }
    }
    if (typeof saveDB === "function") saveDB();
    else localStorage.setItem("norematiReforma", JSON.stringify(db));
    render();
  }
  window.delFromModal = function (type, id, parentType, parentId) {
    if (!confirm("Excluir este vínculo?")) return;
    db[type] = db[type].filter((x) => String(x.id) !== String(id));
    finishDelSync(type);
    if (parentType && parentId != null) openModal(parentType, parentId);
  };

  const delBaseV14 = del;
  del = function (type, id) {
    if (type === "obra") {
      if (
        !confirm(
          "Excluir esta etapa? Os vínculos de profissionais, materiais e equipamentos ligados a ela também serão excluídos.",
        )
      )
        return;
      db.trabalhos = (db.trabalhos || []).filter((t) => String(t.etapaId) !== String(id));
      db.materiais = (db.materiais || []).filter((m) => String(m.etapaId) !== String(id));
      db.equipamentos = (db.equipamentos || []).filter((e) => String(e.etapaId) !== String(id));
      db.obra = db.obra.filter((x) => x.id !== id);
      finishDelSync("obra");
      if (typeof syncChecklistFromStages === "function") syncChecklistFromStages();
      return;
    }
    if (type === "profissionais") {
      if (!confirm("Excluir este profissional? Todos os vínculos de trabalho dele também serão excluídos.")) return;
      db.trabalhos = (db.trabalhos || []).filter((t) => String(t.profissionalId) !== String(id));
      db.profissionais = db.profissionais.filter((x) => x.id !== id);
      finishDelSync("profissionais");
      return;
    }
    if (type === "trabalhos") {
      if (!confirm("Excluir este vínculo de trabalho?")) return;
      db.trabalhos = db.trabalhos.filter((x) => String(x.id) !== String(id));
      finishDelSync("trabalhos");
      return;
    }
    if (type === "materiais" || type === "equipamentos") {
      if (!confirm("Excluir este registro?")) return;
      db[type] = db[type].filter((x) => x.id !== id);
      finishDelSync(type);
      return;
    }
    return delBaseV14(type, id);
  };

  /* ------------------------------------------------------------------ *
   * 6) PAGE HTML — Obra / Cronograma / Profissionais / Materiais /
   *    Equipamentos reformulados; Dashboard recebe patch cirúrgico
   *    (remove "Administrativo pago", ajusta o texto de mão de obra).
   * ------------------------------------------------------------------ */
  function obraPageHtml() {
    return (
      header("Obra", "Execução, responsáveis, prioridades e conclusão", `<button class='btn' onclick="openModal('obra')">+ Adicionar etapa</button>`) +
