      `<div class='card'><table><thead><tr><th>Etapa</th><th>Responsável</th><th>Custo</th><th>Prioridade</th><th>Prazo</th><th>Situação</th><th>Progresso</th><th></th></tr></thead><tbody>${
        db.obra.length
          ? db.obra
              .map((x) => {
                const s = autoSituation(x);
                return `<tr><td><b>${esc(x.nome)}</b><div class='hint'>${esc(x.categoria)}${x.dependencia ? " · depende de " + esc(x.dependencia) : ""}</div></td><td>${responsavelEtapaHtml(x)}</td><td>${custoEtapaHtml(x)}</td><td>${val(x, "prioridade")}</td><td>${fmt(x.inicio)} → ${fmt(x.fim)}${x.fimReal ? `<div class='hint'>Concluído: ${fmt(x.fimReal)}</div>` : ""}</td><td class='${s.cls}'>${s.label}</td><td>${x.progresso || 0}%</td><td class='rowactions'><button onclick="openModal('obra',${x.id})">Editar</button> <button onclick="showWorkChecklist(${x.id})">Checklist</button> <button onclick="del('obra',${x.id})">Excluir</button></td></tr>`;
              })
              .join("")
          : `<tr><td colspan='8' class='empty'>Nenhuma etapa cadastrada.</td></tr>`
      }</tbody></table></div>`
    );
  }

  function cronogramaPageHtml() {
    syncChecklistFromStages();
    const st = checklistStats();
    const itemsHtml = db.checklist.length
      ? db.checklist
          .map((x) => {
            const prog = x.auto ? db.obra.find((s) => String(s.id) === String(x.sourceObraId))?.progresso || 0 : null;
            return `<label class="checkitem auto-item">
        <span class="auto-label">
          <input type="checkbox" ${x.feito ? "checked" : ""} onchange="toggleChecklistItem('${x.id}',this.checked)">
          <span>${esc(x.nome)}</span>
        </span>
        <span class="item-tools">${x.auto ? `<span class="auto-chip">Automático · ${prog}%</span>` : ""}<button type="button" onclick="event.preventDefault();editChecklistItem('${x.id}')">Editar</button><button type="button" onclick="event.preventDefault();deleteChecklistItem('${x.id}')">Excluir</button></span>
      </label>`;
          })
          .join("")
      : `<div class="empty">Nenhum item no checklist ainda. Cadastre etapas na obra ou clique em "+ Novo item".</div>`;
    return (
      header("Cronograma", "Prazos, dependências e situação automática", `<button class='btn' onclick="openModal('obra')">+ Adicionar etapa</button>`) +
      `<div class='card'><table><thead><tr><th>Etapa</th><th>Dependência</th><th>Início</th><th>Fim</th><th>Situação</th><th>Progresso</th><th></th></tr></thead><tbody>${db.obra
        .map((x) => {
          const s = autoSituation(x);
          return `<tr><td><b>${esc(x.nome)}</b><div class='hint'>${
            profissionaisResponsaveisEtapa(x.id)
              .map((p) => esc(p.nome))
              .join(", ") || ""
          }</div></td><td>${esc(x.dependencia || "—")}</td><td>${fmt(x.inicio)}</td><td>${fmt(x.fim)}</td><td class='${s.cls}'>${s.label}</td><td><div class='progressline'><div class='bar'><i style='width:${x.progresso || 0}%'></i></div>${x.progresso || 0}%</div></td><td class='rowactions'><button onclick="openModal('obra',${x.id})">Editar</button></td></tr>`;
        })
        .join("")}</tbody></table></div>
    <div class='card section' style='margin-top:14px'>
      <div class='toolbar'>
        <div>
          <h3 style='margin:0'>Checklist da obra</h3>
          <span class='hint'>Etapas chegam a 100% e são marcadas automaticamente. Adicione, edite ou exclua qualquer item.</span>
        </div>
        <div class='checklist-head-actions'>
          <div class='checklist-progress'><div class='mini-progress'><i style='width:${st.pct}%'></i></div><span>${st.done}/${st.total} · ${st.pct}%</span></div>
          <button class='btn secondary' onclick='addChecklistItem()'>+ Novo item</button>
        </div>
      </div>
      ${itemsHtml}
      ${st.total > 0 && st.done === st.total ? `<div class='mini-note' style='margin-top:14px;color:#55765f;font-weight:800'>✓ CHECKLIST CONCLUÍDO — todos os itens foram finalizados.</div>` : ""}
    </div>`
    );
  }

  function profissionaisPageHtml() {
    return (
      header("Profissionais", "Cadastro fixo e vínculos de trabalho por etapa", `<button class='btn' onclick="openModal('profissionais')">+ Adicionar profissional</button>`) +
      `<div class='card'><table><thead><tr><th>Nome</th><th>Serviço</th><th>Contato</th><th>Valor Total</th><th>Valor Pago</th><th>Status</th><th></th></tr></thead><tbody>${
        db.profissionais.length
          ? db.profissionais
              .map((p) => {
                const total = valorTotalProfissional(p.id),
                  pago = valorPagoProfissional(p.id),
                  n = trabalhosDoProfissional(p.id).length;
                return `<tr><td><b>${esc(p.nome)}</b></td><td>${esc(p.servico || "—")}</td><td>${esc(p.telefone || "—")}<div class='hint'>${esc(p.email || "")}</div></td><td>${money(total)}</td><td>${money(pago)}</td><td>${badge(p.status)}</td><td class='rowactions'><button onclick="openModal('profissionais',${p.id})">Editar / Trabalhos (${n})</button> <button onclick="del('profissionais',${p.id})">Excluir</button></td></tr>`;
              })
              .join("")
          : `<tr><td colspan='7' class='empty'>Nenhum profissional cadastrado.</td></tr>`
      }</tbody></table></div>`
    );
  }

  function materiaisPageHtml() {
    return (
      header("Materiais", "Compras vinculadas às etapas da obra", `<button class='btn' onclick="openModal('materiais')">+ Adicionar material</button>`) +
      `<div class='card'><table><thead><tr><th>Material</th><th>Categoria</th><th>Etapa</th><th>Qtd.</th><th>Valor unitário</th><th>Total</th><th>Pago</th><th>Status</th><th></th></tr></thead><tbody>${
        db.materiais.length
          ? db.materiais
              .map((x) => {
                const etapa = db.obra.find((e) => String(e.id) === String(x.etapaId));
                return `<tr><td><b>${esc(x.nome)}</b><div class='hint'>${esc(x.fornecedor || "")}</div></td><td>${esc(x.categoria || "")}</td><td>${etapa ? esc(etapa.nome) : "<span class='hint'>— sem etapa —</span>"}</td><td>${x.quantidade || 0} ${esc(x.unidade || "")}</td><td>${money(x.unitario || 0)}</td><td><b>${money(materialTotal(x))}</b></td><td>${money(x.pago || 0)}</td><td>${badge(x.status)}</td><td class='rowactions'><button onclick="openModal('materiais',${x.id})">Editar</button> <button onclick="del('materiais',${x.id})">Excluir</button></td></tr>`;
              })
              .join("")
          : `<tr><td colspan='9' class='empty'>Nenhum material cadastrado.</td></tr>`
      }</tbody></table></div>`
    );
  }

  function equipamentosPageHtml() {
    return (
      header(
        "Equipamentos de Pilates",
        "Inventário de equipamentos, vinculados às etapas da obra",
        `<button class='btn' onclick="openModal('equipamentos')">+ Adicionar equipamento</button>`,
      ) +
      `<div class='card'><table><thead><tr><th>Aparelho</th><th>Etapa</th><th>Qtd.</th><th>Valor</th><th>Forma</th><th>Compra</th><th>Entrega</th><th>Status</th><th></th></tr></thead><tbody>${
        db.equipamentos.length
          ? db.equipamentos
              .map((x) => {
                const etapa = db.obra.find((e) => String(e.id) === String(x.etapaId));
                const formaTxt =
                  x.forma === "Cartão" && x.valorParcela
                    ? `Cartão · ${parseInt(x.parcelas) || 1}x de ${money(x.valorParcela)}`
                    : x.forma || "—";
                return `<tr><td><b>${esc(x.nome)}</b><div class='hint'>${esc(x.fornecedorNome || "")}</div></td><td>${etapa ? esc(etapa.nome) : "<span class='hint'>— sem etapa —</span>"}</td><td>${x.quantidade || 0}</td><td>${money(x.valor || 0)}</td><td>${esc(formaTxt)}</td><td>${fmt(x.compra)}</td><td>${fmt(x.entrega)}</td><td>${badge(x.status)}</td><td class='rowactions'><button onclick="openModal('equipamentos',${x.id})">Editar</button> <button onclick="del('equipamentos',${x.id})">Excluir</button></td></tr>`;
              })
              .join("")
          : `<tr><td colspan='9' class='empty'>Nenhum equipamento cadastrado.</td></tr>`
      }</tbody></table></div>`
    );
  }

  const pageBaseV14 = page;
  page = function (k) {
    if (k === "obra") return obraPageHtml();
    if (k === "cronograma") return cronogramaPageHtml();
    if (k === "profissionais") return profissionaisPageHtml();
    if (k === "materiais") return materiaisPageHtml();
    if (k === "equipamentos") return equipamentosPageHtml();
    let html = pageBaseV14(k);
    if (k === "dashboard") {
      html = html.replace(/<tr><td>Administrativo pago<\/td><td>.*?<\/td><\/tr>/, "");
      html = html.replace("Mão de obra (profissionais avulsos)", "Mão de obra (profissionais)");
      html = html.replace(
        `<p class='hint'>Equipamentos e administrativo permanecem separados do orçamento da obra. "Mão de obra (profissionais avulsos)" soma só quem está cadastrado em Profissionais mas não vinculado a nenhuma etapa da Obra — evita contar o mesmo custo duas vezes.</p>`,
        `<p class='hint'>Todos os valores desta tabela vêm da soma dos vínculos de profissionais, materiais e equipamentos de cada etapa da Obra — não existem mais valores digitados soltos, nem risco de contar o mesmo custo duas vezes.</p>`,
      );
    }
    return html;
  };

  /* ------------------------------------------------------------------ *
   * 7) Banner de itens pendentes de revisão pós-migração
   * ------------------------------------------------------------------ */
  const renderBaseV14 = render;
  render = function () {
    renderBaseV14();
    const pending = db._migrationPending || [];
    let el = document.getElementById("migrationBanner");
    if (!pending.length) {
      if (el) el.remove();
      return;
    }
    if (!el) {
      el = document.createElement("div");
      el.id = "migrationBanner";
      el.style.cssText =
        "position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#fff3da;border:1px solid #d8b473;color:#5a4420;padding:10px 16px;border-radius:12px;font-size:12px;z-index:80;box-shadow:0 8px 22px rgba(93,65,28,.18);max-width:92vw";
      document.body.appendChild(el);
    }
    el.innerHTML = `⚠ ${pending.length} item(ns) precisam de etapa/vínculo revisado após a migração de dados — veja o console para detalhes. <button style="margin-left:8px;border:0;background:transparent;color:#5a4420;font-weight:700;cursor:pointer;text-decoration:underline" onclick="document.getElementById('migrationBanner').remove()">Ok, entendi</button>`;
  };

  /* ------------------------------------------------------------------ *
   * 8) Backup: garante que um backup ANTIGO (sem trabalhos/pré-V2)
   *    restaurado também passe pela migração V2 ao ser importado.
   * ------------------------------------------------------------------ */
  const importFullBackupBaseV14 = typeof importFullBackup === "function" ? importFullBackup : null;
  if (importFullBackupBaseV14) {
    importFullBackup = function (input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        let parsed;
        try {
          parsed = JSON.parse(reader.result);
        } catch (e) {
          alert("Arquivo inválido: não é um JSON válido.");
          input.value = "";
          return;
        }
        const incoming = parsed && typeof parsed === "object" && parsed.dados ? parsed.dados : parsed;
        const pareceValido =
          incoming && typeof incoming === "object" && (Array.isArray(incoming.projects) || Array.isArray(incoming.obra));
        if (!pareceValido) {
          alert("Este arquivo não parece ser um backup válido deste sistema.");
          input.value = "";
          return;
        }
        if (
          !confirm(
            "Restaurar este backup vai SUBSTITUIR todos os dados atuais (todas as obras, financeiro, materiais, equipamentos etc.) pelos dados desse arquivo.\n\nEssa ação não pode ser desfeita. Deseja continuar?",
          )
        ) {
          input.value = "";
          return;
        }
        db = incoming;
        try {
          if (typeof migrateProjectsSafe === "function") migrateProjectsSafe();
          if (typeof syncAliases === "function") syncAliases();
          if (typeof migrateChecklistUnificado === "function") migrateChecklistUnificado();
          if (typeof migrateObraResponsavelVinculo === "function") migrateObraResponsavelVinculo();
          ensureTrabalhosArrays();
          if (!db._migratedV2) runMigrationV2();
          if (typeof syncChecklistFromStages === "function") syncChecklistFromStages();
          if (typeof syncAliases === "function") syncAliases();
          if (typeof saveDB === "function") saveDB();
          else localStorage.setItem("norematiReforma", JSON.stringify(db));
        } catch (e) {
          alert("O backup foi lido, mas houve um erro ao aplicá-lo: " + e.message);
        }
        input.value = "";
        render();
        (typeof window.showToast==="function"?window.showToast("Backup restaurado com sucesso.","success"):alert("Backup restaurado com sucesso."));
      };
      reader.onerror = () => alert("Não foi possível ler o arquivo selecionado.");
      reader.readAsText(file);
    };
  }

  render();
})();
</script>
<script>
/* V15 — reordenação do menu + Backup movido para dentro de Configurações +
   separadores visuais "CADASTROS" / "ACOMPANHAMENTO" no menu lateral. */
(function(){
  // remove o item "Backup" solto do menu principal (mobile e desktop)
  const bi = menus.findIndex(m => m[0] === 'backup');
  if (bi >= 0) menus.splice(bi, 1);

  function backupSectionHTML(){
    return `<h3 style="margin:26px 0 4px">Backup e restauração</h3>
    <div class="grid two">
      <div class="card section">
        <h3 style="margin-top:0">Baixar backup</h3>
        <p class="hint">Gera um arquivo .json com o estado completo do sistema — todos os projetos cadastrados, serviços da obra, financeiro, materiais, equipamentos, profissionais e configurações. Guarde esse arquivo em um lugar seguro (e-mail, Google Drive, pendrive) periodicamente, já que os dados vivem apenas neste navegador.</p>
        <div class="actions" style="justify-content:flex-start;margin-top:16px">
          <button class="btn" onclick="exportFullBackup()">⬇ Baixar backup (.json)</button>
        </div>
      </div>
      <div class="card section">
        <h3 style="margin-top:0">Restaurar backup</h3>
        <p class="hint">Selecione um arquivo .json exportado por este mesmo sistema. <b>Isso substitui todos os dados atuais</b> pelos dados do arquivo — não pode ser desfeito.</p>
        <div class="actions" style="justify-content:flex-start;margin-top:16px">
          <button class="btn secondary" onclick="document.getElementById('restoreFileInput').click()">⬆ Restaurar backup</button>
          <input type="file" id="restoreFileInput" accept=".json,application/json" style="display:none" onchange="importFullBackup(this)">
        </div>
      </div>
    </div>
    <div class="mini-note" style="margin-top:14px">Os dados deste sistema ficam salvos somente neste navegador (armazenamento local). Sem um backup baixado, limpar o cache, trocar de computador ou desinstalar o navegador apaga tudo permanentemente.</div>`;
  }

  const pageV15Base = page;
  page = function(k){
    const out = pageV15Base(k);
    if (k === 'config') return out + backupSectionHTML();
    return out;
  };

  render();
})();
</script>
<script>
/* V16 — Categorias editáveis (Obra/Materiais) + cadastro de Fornecedores,
   com seleção de fornecedor (em vez de texto livre) em Materiais/Equipamentos.
   Nota: os formulários de Obra/Materiais/Equipamentos (V14) rodam dentro de uma
   IIFE isolada — foram editados diretamente ali pra usar db.categoriasObra/
   db.categoriasMaterial e window.fFornecedorSelect definidos aqui. */
(function(){
  const CATEGORIAS_OBRA_DEFAULT = "Demolição|Alvenaria|Elétrica|Hidráulica|Iluminação|Pintura|Piso|Climatização|Limpeza|Acabamentos|Imprevistos";
  const CATEGORIAS_MATERIAL_DEFAULT = "Demolição|Alvenaria|Elétrica|Hidráulica|Iluminação|Pintura|Piso|Climatização|Banheiros|Acabamentos|Limpeza|Ferragens e fixação|Outros";
  db.categoriasObra = db.categoriasObra && db.categoriasObra.length ? db.categoriasObra : CATEGORIAS_OBRA_DEFAULT.split('|');
  db.categoriasMaterial = db.categoriasMaterial && db.categoriasMaterial.length ? db.categoriasMaterial : CATEGORIAS_MATERIAL_DEFAULT.split('|');
  db.fornecedores = db.fornecedores || [];

  function findOrCreateFornecedor(nome, telefone, email, site){
    nome = (nome||'').trim();
    if (!nome) return null;
    let f = db.fornecedores.find(x => (x.nome||'').trim().toLowerCase() === nome.toLowerCase());
    if (!f) {
      f = { id: Date.now() + Math.floor(Math.random()*1000), nome, telefone: telefone||'', email: email||'', site: site||'' };
      db.fornecedores.push(f);
    }
    return f;
  }

  // migração única: fornecedor (texto) -> fornecedorId
  if (!db._migratedFornecedoresV1) {
    (db.materiais||[]).forEach(m => {
      if (!m.fornecedorId && m.fornecedor) {
        const f = findOrCreateFornecedor(m.fornecedor);
        if (f) m.fornecedorId = f.id;
      }
    });
    (db.equipamentos||[]).forEach(e => {
      if (!e.fornecedorId && e.fornecedorNome) {
        const f = findOrCreateFornecedor(e.fornecedorNome, e.fornecedorTelefone, e.fornecedorEmail);
        if (f) e.fornecedorId = f.id;
      }
    });
    db._migratedFornecedoresV1 = true;
    saveDB();
  }

  schemas.fornecedores = [['nome','text'],['telefone','text'],['email','text'],['site','text']];
  Object.assign(labels, { site: 'Site / Instagram' });

  window.fFornecedorSelect = function(name, selected){
    const opts = (db.fornecedores||[]).map(f =>
      `<option value='${f.id}' ${String(selected)===String(f.id)?'selected':''}>${esc(f.nome)}</option>`
    ).join('');
    const boxId = 'novoFornBox_' + name;
    return `<div class='full'><label>Fornecedor</label><div style='display:flex;gap:8px;align-items:flex-start'>
      <select name='${name}' id='sel_${name}' style='flex:1'><option value=''>Selecione o fornecedor…</option>${opts}</select>
      <button type='button' class='btn secondary' onclick="toggleNovoFornecedor('${name}')">+ Novo</button>
    </div>
    <div id='${boxId}' class='mini-note' style='display:none;margin-top:10px'>
      <div class='form' style='grid-template-columns:1fr 1fr;gap:10px'>
        <div><label>Nome do fornecedor *</label><input type='text' id='nf_nome_${name}'></div>
        <div><label>Telefone</label><input type='text' id='nf_telefone_${name}'></div>
        <div><label>E-mail</label><input type='text' id='nf_email_${name}'></div>
        <div><label>Site / Instagram</label><input type='text' id='nf_site_${name}'></div>
      </div>
      <div style='display:flex;justify-content:flex-start;gap:8px;margin-top:10px'>
        <button type='button' class='btn' onclick="salvarNovoFornecedor('${name}')">Salvar fornecedor</button>
        <button type='button' class='btn secondary' onclick="toggleNovoFornecedor('${name}')">Cancelar</button>
      </div>
    </div>
    <span class='hint'>Cadastro completo de fornecedores também fica em Configurações.</span></div>`;
  };

  window.toggleNovoFornecedor = function(name){
    const box = document.getElementById('novoFornBox_' + name);
    if (!box) return;
    const showing = box.style.display !== 'none';
    box.style.display = showing ? 'none' : 'block';
    if (!showing) {
      const nomeInput = document.getElementById('nf_nome_' + name);
      if (nomeInput) { nomeInput.value = ''; nomeInput.focus(); }
      ['nf_telefone_','nf_email_','nf_site_'].forEach(p => { const el = document.getElementById(p+name); if (el) el.value = ''; });
    }
  };

  window.salvarNovoFornecedor = function(name){
    const nome = (document.getElementById('nf_nome_'+name).value || '').trim();
    if (!nome) { alert('Informe o nome do fornecedor.'); return; }
    const telefone = document.getElementById('nf_telefone_'+name).value || '';
    const email = document.getElementById('nf_email_'+name).value || '';
    const site = document.getElementById('nf_site_'+name).value || '';
    const f = { id: Date.now()+Math.floor(Math.random()*1000), nome, telefone, email, site };
    db.fornecedores.push(f);
    saveDB();
    const sel = document.getElementById('sel_'+name);
    if (sel) {
      const opt = document.createElement('option');
      opt.value = f.id; opt.textContent = f.nome;
      sel.appendChild(opt);
      sel.value = f.id;
    }
    toggleNovoFornecedor(name);
  };

  window.categoriaFieldHtml = function(kind, selected){
    const arrKey = kind === 'obra' ? 'categoriasObra' : 'categoriasMaterial';
    const opts = (db[arrKey]||[]).map(c => `<option ${String(selected)===c?'selected':''}>${esc(c)}</option>`).join('');
    const boxId = 'novoCatBox_' + kind;
    return `<div><label>Categoria</label><div style='display:flex;gap:8px;align-items:flex-start'>
      <select name='categoria' id='selCat_${kind}' style='flex:1'>${opts}</select>
      <button type='button' class='btn secondary' onclick="toggleNovaCategoria('${kind}')">+ Nova</button>
    </div>
    <div id='${boxId}' class='mini-note' style='display:none;margin-top:8px'>
      <div style='display:flex;gap:8px;align-items:flex-end'>
        <div style='flex:1'><label>Nova categoria</label><input type='text' id='nc_${kind}'></div>
        <button type='button' class='btn' onclick="salvarNovaCategoria('${kind}')">Adicionar</button>
        <button type='button' class='btn secondary' onclick="toggleNovaCategoria('${kind}')">Cancelar</button>
      </div>
    </div></div>`;
  };

  window.toggleNovaCategoria = function(kind){
    const box = document.getElementById('novoCatBox_' + kind);
    if (!box) return;
    const showing = box.style.display !== 'none';
    box.style.display = showing ? 'none' : 'block';
    if (!showing) {
      const inp = document.getElementById('nc_' + kind);
      if (inp) { inp.value = ''; inp.focus(); }
    }
  };

  window.salvarNovaCategoria = function(kind){
    const arrKey = kind === 'obra' ? 'categoriasObra' : 'categoriasMaterial';
    const inp = document.getElementById('nc_' + kind);
    const v = (inp.value || '').trim();
    if (!v) { alert('Informe o nome da categoria.'); return; }
    if (db[arrKey].some(c => c.toLowerCase() === v.toLowerCase())) { alert('Essa categoria já existe.'); return; }
    db[arrKey].push(v);
    saveDB();
    const sel = document.getElementById('selCat_' + kind);
    if (sel) {
      const opt = document.createElement('option');
      opt.textContent = v;
      sel.appendChild(opt);
      sel.value = v;
    }
    toggleNovaCategoria(kind);
  };

  function chip(text, onRemove){
    return `<span class='badge' style='display:inline-flex;align-items:center;gap:6px;margin:3px 5px 3px 0'>${esc(text)}<button type='button' onclick="${onRemove}" style='border:0;background:transparent;cursor:pointer;color:var(--muted);font-weight:700'>✕</button></span>`;
  }

  function categoriasSectionHTML(){
    const p = typeof curP === 'function' ? curP() : null;
    const extraObra = (p && p.categoriasObraExtra) || [];
    const extraMat = (p && p.categoriasMaterialExtra) || [];
    return `<h3 style="margin:26px 0 4px">Categorias</h3>
    <p class="hint" style="margin-top:0">Base geral, disponível em todos os projetos. Cada projeto também pode ter categorias só dele (adicionadas direto no formulário de Obra/Materiais).</p>
    <div class="grid two">
      <div class="card section">
        <h3 style="margin-top:0">Categorias de Obra</h3>
        <div>${db.categoriasObra.map(c => chip(c, `removeCategoria('obra','${esc(c).replace(/'/g,"\\'")}')`)).join('') || '<span class="hint">Nenhuma categoria.</span>'}</div>
        <div class="actions" style="justify-content:flex-start;margin-top:12px;gap:8px">
          <input id="novaCatObra" placeholder="Nova categoria" style="flex:1;background:#fffaf3;border:1px solid var(--line);border-radius:9px;padding:10px">
          <button class="btn secondary" onclick="addCategoria('obra')">+ Adicionar</button>
        </div>
      </div>
      <div class="card section">
        <h3 style="margin-top:0">Categorias de Materiais</h3>
        <div>${db.categoriasMaterial.map(c => chip(c, `removeCategoria('material','${esc(c).replace(/'/g,"\\'")}')`)).join('') || '<span class="hint">Nenhuma categoria.</span>'}</div>
        <div class="actions" style="justify-content:flex-start;margin-top:12px;gap:8px">
          <input id="novaCatMaterial" placeholder="Nova categoria" style="flex:1;background:#fffaf3;border:1px solid var(--line);border-radius:9px;padding:10px">
          <button class="btn secondary" onclick="addCategoria('material')">+ Adicionar</button>
        </div>
      </div>
    </div>
    ${(extraObra.length || extraMat.length) ? `<div class="grid two" style="margin-top:10px">
      <div class="card section">
        <h3 style="margin-top:0">Categorias só deste projeto (Obra)</h3>
        <div>${extraObra.map(c => chip(c, `removeCategoriaProjeto('obra','${esc(c).replace(/'/g,"\\'")}')`)).join('') || '<span class="hint">Nenhuma categoria extra neste projeto.</span>'}</div>
      </div>
      <div class="card section">
        <h3 style="margin-top:0">Categorias só deste projeto (Materiais)</h3>
        <div>${extraMat.map(c => chip(c, `removeCategoriaProjeto('material','${esc(c).replace(/'/g,"\\'")}')`)).join('') || '<span class="hint">Nenhuma categoria extra neste projeto.</span>'}</div>
      </div>
    </div>` : ''}`;
  }

  window.addCategoria = function(kind){
    const inputId = kind==='obra' ? 'novaCatObra' : 'novaCatMaterial';
    const arrKey = kind==='obra' ? 'categoriasObra' : 'categoriasMaterial';
    const input = document.getElementById(inputId);
    const v = (input.value||'').trim();
    if (!v) return;
    if (db[arrKey].some(c => c.toLowerCase()===v.toLowerCase())) { alert('Essa categoria já existe.'); return; }
    db[arrKey].push(v);
    saveDB(); render();
  };
  window.removeCategoria = function(kind, name){
    const arrKey = kind==='obra' ? 'categoriasObra' : 'categoriasMaterial';
    const inUse = kind==='obra'
      ? (db.obra||[]).some(x => x.categoria===name)
      : (db.materiais||[]).some(x => x.categoria===name);
    if (inUse) { alert('Essa categoria está em uso em pelo menos um registro. Troque a categoria desses registros antes de excluir.'); return; }
    if (!confirm(`Excluir a categoria "${name}"?`)) return;
    db[arrKey] = db[arrKey].filter(c => c!==name);
    saveDB(); render();
  };

  function fornecedoresSectionHTML(){
    return `<h3 style="margin:26px 0 4px">Fornecedores</h3>
    <div class="card section">
      <div class="toolbar"><span class="hint">Cadastro usado nos campos "Fornecedor" de Materiais e Equipamentos.</span><button class="btn" onclick="openModal('fornecedores')">+ Adicionar fornecedor</button></div>
      ${table('fornecedores', ['nome','telefone','email','site'])}
    </div>`;
  }

  const pageV16Base = page;
  page = function(k){
    const out = pageV16Base(k);
    if (k === 'config') return out + categoriasSectionHTML() + fornecedoresSectionHTML();
    return out;
  };

  render();
})();
</script>

<script id="v17-anim-js">
(function(){
  let wrap = document.getElementById('toastWrap');
  if(!wrap){
    wrap = document.createElement('div');
    wrap.id = 'toastWrap';
    document.body.appendChild(wrap);
  }

  window.showToast = function(message, type, opts){
    type = type || 'info';
    opts = opts || {};
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    const icon = type === 'success' ? '✓' : (type === 'error' ? '⚠' : 'ℹ');
    el.innerHTML = `<span class="toastIcon">${icon}</span><span class="toastMsg"></span><span class="toastClose">✕</span>`;
    el.querySelector('.toastMsg').textContent = message;
    const remove = () => {
      el.classList.add('leaving');
      setTimeout(() => el.remove(), 250);
    };
    el.querySelector('.toastClose').addEventListener('click', remove);
    wrap.appendChild(el);
    const duration = opts.duration || (type === 'error' ? 7000 : 2800);
    setTimeout(remove, duration);
    return el;
  };

  window.notifySaveError = function(e){
    window.showToast('Não foi possível salvar as alterações neste navegador. Copie o que você fez antes de sair da tela — o armazenamento local pode estar cheio ou bloqueado (ex: aba anônima).', 'error');
  };
})();
</script>
<script id="v18-fornecedores-categorias-por-projeto">
/* ==========================================================================
   V18 — Fornecedores isolados por projeto; Categorias = base global +
   extras só do projeto atual.

   Motivo: um fornecedor de equipamento de pilates não deve aparecer num
   projeto de loja de carro, e vice-versa. Categorias continuam com uma
   base comum (Demolição, Elétrica, Hidráulica...) reaproveitável em
   qualquer projeto novo, mas cada projeto pode adicionar categorias só
   dele (ex.: "Peças de elevador hidráulico" só no projeto da loja de
   carro) sem sujar a lista dos outros projetos.
   ========================================================================== */
(function () {
  "use strict";

  /* 1) Fornecedores entram na lista de campos isolados por projeto —
     o mesmo mecanismo que já isola Obra, Materiais, Equipamentos etc. */
  if (typeof PROJECT_KEYS !== "undefined" && !PROJECT_KEYS.includes("fornecedores")) {
    PROJECT_KEYS.push("fornecedores");
  }
  if (Array.isArray(db.projects)) {
    db.projects.forEach((p) => {
      if (!Array.isArray(p.fornecedores)) p.fornecedores = [];
      if (!Array.isArray(p.categoriasObraExtra)) p.categoriasObraExtra = [];
      if (!Array.isArray(p.categoriasMaterialExtra)) p.categoriasMaterialExtra = [];
    });
  }

  /* Migração única: fornecedores que já existiam soltos em db.fornecedores
     (cadastrados antes desta versão) passam a pertencer ao projeto que
     estava selecionado quando foram criados — hoje, o único projeto
     existente, então nada se perde. */
  if (!db._migratedFornecedoresPerProjectV1) {
    const globalForn = Array.isArray(db.fornecedores) ? db.fornecedores : [];
    const p = typeof curP === "function" ? curP() : null;
    if (p && globalForn.length) {
      const existingIds = new Set((p.fornecedores || []).map((f) => String(f.id)));
      globalForn.forEach((f) => {
        if (!existingIds.has(String(f.id))) p.fornecedores.push(f);
      });
    }
    db._migratedFornecedoresPerProjectV1 = true;
  }
  if (typeof syncAliases === "function") syncAliases();

  /* Excluir fornecedor precisa re-sincronizar com o projeto atual, porque
     filter() cria um array novo (perde a referência compartilhada que o
     syncAliases fez entre db.fornecedores e o projeto). */
  const delBaseV18 = del;
  del = function (type, id) {
    if (type === "fornecedores") {
      if (!confirm("Excluir este fornecedor?")) return;
      db.fornecedores = (db.fornecedores || []).filter((x) => String(x.id) !== String(id));
      const p = typeof curP === "function" ? curP() : null;
      if (p) p.fornecedores = db.fornecedores;
      if (typeof saveDB === "function") saveDB();
      render();
      return;
    }
    return delBaseV18(type, id);
  };

  /* 2) Categorias: base global (db.categoriasObra/categoriasMaterial,
     administrada em Configurações) + extras só do projeto atual. */
  window.categoriasObraEfetivas = function () {
    const p = typeof curP === "function" ? curP() : null;
    const extra = p && Array.isArray(p.categoriasObraExtra) ? p.categoriasObraExtra : [];
    return (db.categoriasObra || []).concat(extra);
  };
  window.categoriasMaterialEfetivas = function () {
    const p = typeof curP === "function" ? curP() : null;
    const extra = p && Array.isArray(p.categoriasMaterialExtra) ? p.categoriasMaterialExtra : [];
    return (db.categoriasMaterial || []).concat(extra);
  };

  /* Formulário de Obra/Materiais passa a listar base + extras do projeto */
  window.categoriaFieldHtml = function (kind, selected) {
    const opts = (kind === "obra" ? categoriasObraEfetivas() : categoriasMaterialEfetivas())
      .map((c) => `<option ${String(selected) === c ? "selected" : ""}>${esc(c)}</option>`)
      .join("");
    const boxId = "novoCatBox_" + kind;
    return `<div><label>Categoria</label><div style='display:flex;gap:8px;align-items:flex-start'>
      <select name='categoria' id='selCat_${kind}' style='flex:1'>${opts}</select>
      <button type='button' class='btn secondary' onclick="toggleNovaCategoria('${kind}')">+ Nova</button>
    </div>
    <div id='${boxId}' class='mini-note' style='display:none;margin-top:8px'>
      <div style='display:flex;gap:8px;align-items:flex-end'>
        <div style='flex:1'><label>Nova categoria (só deste projeto)</label><input type='text' id='nc_${kind}'></div>
        <button type='button' class='btn' onclick="salvarNovaCategoria('${kind}')">Adicionar</button>
        <button type='button' class='btn secondary' onclick="toggleNovaCategoria('${kind}')">Cancelar</button>
      </div>
      <span class='hint'>Fica disponível só neste projeto. Categorias de uso geral são cadastradas em Configurações.</span>
    </div></div>`;
  };

  /* Categoria adicionada pelo formulário vira "extra" do projeto atual —
     não polui a lista base compartilhada por todos os projetos. */
  window.salvarNovaCategoria = function (kind) {
    const extraKey = kind === "obra" ? "categoriasObraExtra" : "categoriasMaterialExtra";
    const inp = document.getElementById("nc_" + kind);
    const v = (inp.value || "").trim();
    if (!v) {
      alert("Informe o nome da categoria.");
      return;
    }
    const efetivas = kind === "obra" ? categoriasObraEfetivas() : categoriasMaterialEfetivas();
    if (efetivas.some((c) => c.toLowerCase() === v.toLowerCase())) {
      alert("Essa categoria já existe.");
      return;
    }
    const p = typeof curP === "function" ? curP() : null;
    if (p) {
      p[extraKey] = p[extraKey] || [];
      p[extraKey].push(v);
    }
    if (typeof saveDB === "function") saveDB();
    const sel = document.getElementById("selCat_" + kind);
    if (sel) {
      const opt = document.createElement("option");
      opt.textContent = v;
      sel.appendChild(opt);
      sel.value = v;
    }
    toggleNovaCategoria(kind);
  };

  /* Config: mostra também as categorias extras do projeto selecionado,
     removíveis separadamente da base global. */
  window.removeCategoriaProjeto = function (kind, name) {
    const extraKey = kind === "obra" ? "categoriasObraExtra" : "categoriasMaterialExtra";
    const p = typeof curP === "function" ? curP() : null;
    if (!p) return;
    const inUse =
      kind === "obra" ? (db.obra || []).some((x) => x.categoria === name) : (db.materiais || []).some((x) => x.categoria === name);
    if (inUse) {
      alert("Essa categoria está em uso em pelo menos um registro. Troque a categoria desses registros antes de excluir.");
      return;
    }
    if (!confirm(`Excluir a categoria "${name}" (só deste projeto)?`)) return;
    p[extraKey] = (p[extraKey] || []).filter((c) => c !== name);
    if (typeof saveDB === "function") saveDB();
    render();
  };

  saveDB();
})();
</script>

<script id="v19-finance-config-ui">
/* V19 — refinamento visual solicitado para Financeiro e Configurações.
   Mantém dados, cálculos, ações e persistência existentes. */
(function(){
  function financeStatus(prev, real){
    if(!prev && !real) return {label:'OK',cls:''};
    if(!prev && real>0) return {label:'Sem previsto',cls:'limit'};
    if(real>prev) return {label:'Acima',cls:'limit'};
    if(real===prev && prev>0) return {label:'No limite',cls:'limit'};
    return {label:'OK',cls:''};
  }

  function financePageV19(){
    const t=totals();
    const cats=categoryStats();
    const budget=+db.config.orcamento||0;
    const committed=t.contratado+unforeseenTotal();
    const pct=(value)=>budget?Math.max(0,Math.round((value/budget)*100)):0;
    const rows=Object.entries(cats).map(([name,v])=>{
      const used=v.prev?Math.max(0,Math.round((v.real/v.prev)*100)):(v.real?100:0);
      const st=financeStatus(+v.prev||0,+v.real||0);
      return `<div class="finance-category-row">
        <b class="finance-cat-name">${esc(name)}</b>
        <span class="finance-cat-money">${money(v.prev)}</span>
        <span class="finance-cat-money">${money(v.real)}</span>
        <div class="finance-consumption"><div class="chart-track"><i style="width:${Math.min(100,used)}%"></i></div></div>
        <span>${used}%</span>
        <span class="finance-status ${st.cls}">${st.label}</span>
      </div>`;
    }).join('');

    const issues=(db.imprevistos||[]);
    const issuesHtml=issues.length
      ? `<div class="tablewrap">${table('imprevistos',['nome','categoria','valor','impactoDias','status'])}</div>`
      : `<div class="finance-empty"><div><b>Nenhum imprevisto registrado</b><span>Registre aqui os custos não previstos que surgirem durante a obra.</span><div style="margin-top:16px"><button class="btn" onclick="openModal('imprevistos')">+ Registrar imprevisto</button></div></div></div>`;

    return `<div class="finance-v19">${header('Financeiro','Orçamento, pagamentos, imprevistos e comparativo por categoria',`<button class='btn' onclick="openModal('pagamentos')">+ Registrar pagamento</button>`)}
      <div class="grid finance-kpis">
        <div class="card kpi finance-kpi"><small>Investimento planejado</small><strong>${money(budget)}</strong><span class="hint">Total do orçamento</span></div>
        <div class="card kpi finance-kpi"><small>Comprometido total</small><strong>${money(committed)}</strong><span class="hint">${pct(committed)}% do planejado</span></div>
        <div class="card kpi finance-kpi"><small>Pago</small><strong>${money(t.pago)}</strong><span class="hint">${pct(t.pago)}% do planejado</span></div>
        <div class="card kpi finance-kpi"><small>Imprevistos</small><strong>${money(unforeseenTotal())}</strong><span class="hint">${pct(unforeseenTotal())}% do planejado</span></div>
        <div class="card kpi finance-kpi"><small>A pagar (agendado)</small><strong>${money(paymentDue())}</strong><span class="hint">${pct(paymentDue())}% do planejado</span></div>
      </div>
      <div class="finance-main-grid">
        <div class="card section finance-panel">
          <div class="finance-panel-head"><div><h3>Previsto × Contratado por categoria</h3><span class="hint">Onde o orçamento está sendo consumido</span></div></div>
          ${rows?`<div class="finance-category-table"><div class="finance-category-head"><span>Categoria</span><span>Previsto</span><span>Contratado</span><span>Consumo</span><span>%</span><span>Status</span></div>${rows}</div>`:`<div class="empty">Cadastre valores na obra para gerar o comparativo.</div>`}
        </div>
        <div class="card section finance-panel">
          <div class="finance-panel-head"><div><h3>Imprevistos</h3><span class="hint">Custos não previstos no orçamento original</span></div><button class="btn secondary" onclick="openModal('imprevistos')">+ Registrar</button></div>
          ${issuesHtml}
        </div>
      </div>
      <div class="card section" style="margin-top:14px"><div class="toolbar"><h3 style="margin:0">Histórico e próximos pagamentos</h3><button class="btn secondary" onclick="openModal('pagamentos')">+ Pagamento</button></div><div class="tablewrap">${table('pagamentos',['referencia','tipo','valor','vencimento','forma','status'])}</div></div>
    </div>`;
  }

  const pageV19Base=page;
  page=function(k){
    if(k==='financeiro') return financePageV19();
    return pageV19Base(k);
  };

  /* Aplica classes de layout às seções já existentes de Configurações,
     sem duplicar dados nem alterar as funções de backup/categorias. */
  const renderV19Base=render;
  render=function(){
    renderV19Base();

    /* Mantém a montagem do menu agrupado da V15 dentro do wrapper final,
       eliminando uma camada intermediária de render sem mudar o resultado. */
    const nav=document.getElementById('nav');
    if(nav && menus._grupos){
      let html='', lastGrupo=null;
      menus.forEach(([k,n])=>{
        const grupo=menus._grupos[k]||null;
        if(grupo && grupo!==lastGrupo){
          html += `<div style="margin:14px 10px 4px;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted)">${grupo}</div>`;
        }
        lastGrupo=grupo;
        html += `<button class='${current==k?'active':''}' onclick="go('${k}')"><span class='mi'>${svgIcon(k)}</span><span>${n}</span></button>`;
      });
      nav.innerHTML=html;
    }

    if(current!=='config') return;
    const pageRoot=document.getElementById('pages');
    if(!pageRoot) return;

    pageRoot.querySelectorAll('h3').forEach(h=>{
      const title=(h.textContent||'').trim();
      if(title==='Backup e restauração' || title==='Categorias'){
        h.classList.add('config-v19-title');
        const grid=h.nextElementSibling && h.nextElementSibling.classList.contains('grid') ? h.nextElementSibling : null;
        if(grid){
          grid.classList.add('config-v19-grid');
          grid.querySelectorAll(':scope > .card').forEach(card=>card.classList.add('config-v19-card'));
        }
      }
    });

    ['novaCatObra','novaCatMaterial'].forEach(id=>{
      const input=document.getElementById(id);
      if(input && input.parentElement) input.parentElement.classList.add('config-v19-add');
    });
  };
  render();
})();
</script>
